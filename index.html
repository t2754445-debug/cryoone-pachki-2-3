    body = `<div class="cmp"><table><tr><th></th>${DATA.styles.map(x => `<th>${esc(x.name)}</th>`).join('')}</tr>
      ${rows.map(r => `<tr><th>${r[1]}</th>${DATA.styles.map(x => `<td>${shot(x.id, r[0], r[1])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  } else {
    const gal = DATA.gallery.map(g => shot(v, g[0], g[1])).join('');
    body = `<div class="stylehead">
      <div class="card"><h3>${esc(s.name)} <span class="mute small">· ${esc(s.tag)}</span></h3>
        <p>${esc(s.idea)}</p>
        <p><span class="gold">Почему:</span> ${esc(s.why)}</p>
        <p><span class="gold">Риск:</span> ${esc(s.risk)}</p>
        <p class="small"><span class="gold">Движение:</span> ${esc(s.motion)}</p>
        ${st.style === v ? '<span class="chosen">Выбран</span>' : `<button class="btn" data-pick="${v}">Берём этот стиль</button>`}
      </div>
      <div class="card"><h3>Карта стиля</h3>
        <dl class="kv">${s.look.map(l => `<dt>${esc(l[0])}</dt><dd>${esc(l[1])}</dd>`).join('')}</dl>
        <div class="pal">${DATA.palette.map(p => `<div class="sw" style="background:${p[1]};color:${p[0] === 'Золото' || p[0] === 'Бумага' ? '#0D1220' : '#E8E6E1'}">${p[0]}</div>`).join('')}</div>
        <dl class="kv small">${DATA.series.map(l => `<dt>${esc(l[0])}</dt><dd>${esc(l[1])}</dd>`).join('')}</dl>
      </div></div>
      <div class="gal">${gal}</div>
      ${DATA.flaws[v] ? `<p class="small mute">Брак проб: ${esc(DATA.flaws[v])}</p>` : ''}`;
  }
  return `<section id="styles"><h2>Три стиля</h2>
    <p class="lead">Первый — наш из ролика 2, два новых. Цвета, шрифты, титры и финал у всех одинаковые (К2) — меняется только рисовка.
    Дмитрий нарисован по кадрам подкаста: личных фото пока нет. Нос — меньше и аккуратнее, чем в первом образе.</p>
    <div class="photo-vs">${DATA.refs.map(r => `<img src="${r}" alt="кадр подкаста">`).join('')}<span class="small mute" style="align-self:end">← по этим кадрам</span></div>
    <div class="tabs">${tabs}</div>${body}</section>`;
}

function renderPers() {
  const sty = curStyle();
  return `<section id="pers"><h2>Персонажи</h2>
    <p class="lead">Постоянные — трое. Предприниматель и Администратор — эпизоды, но нужны уже в первой пачке.
    Картинки — в стиле «${esc(DATA.styles.find(x => x.id === sty).name)}».</p>
    <div class="pers">${DATA.chars.map(c => `<div class="card">${shot(sty, c.id, c.name)}
      <h3>${esc(c.name)} <span class="role ${c.role === 'постоянный' ? 'const' : ''}">${c.role}</span></h3>
      <div class="small">${esc(c.who)}</div><div class="small mute">${esc(c.char)}</div><div class="small gold">${esc(c.line)}</div></div>`).join('')}</div>
    <p class="small mute">${esc(DATA.later)}</p></section>`;
}

function yn(id) {
  const v = st.r[id] || '';
  return `<div class="yn"><button class="y ${v === 'y' ? 'on' : ''}" data-yn="${id}" data-v="y">да</button><button class="n ${v === 'n' ? 'on' : ''}" data-yn="${id}" data-v="n">нет</button></div>`;
}

function lineHtml(l) {
  const sty = curStyle();
  const live = l.who.startsWith('live:');
  const vid = /^live:В/.test(l.who);
  const who = live ? 'dm' : l.who;
  const src = vid ? 'logo.png' : img(sty, live ? 'dm_3' : who) || 'logo.png';
  const sg = l.sign === '+' ? 'p' : l.sign === '−' ? 'm' : 'pm';
  return `<div class="line ${live ? 'live' : ''}"><img class="ava ${live ? 'live' : ''}" src="${src}" alt="">
    <div><div class="who">${vid ? 'Живое видео ' + esc(l.who.slice(5)) : live ? 'Дмитрий · живой голос ' + esc(l.who.slice(5) === 'Ж' ? '«Жить здорово»' : l.who.slice(5)) : esc(PN[who] || who)} · ${esc(l.role)}<span class="sg ${sg}">${esc(l.sign)}</span></div>
    <div class="say">${esc(l.text)}</div><div class="scr">${esc(l.screen)}</div></div></div>`;
}

function rollHtml(r, full) {
  const res = DATA.reserve[r.rub] || [];
  const open = st.open[r.id] ? 'open' : '';
  const no = st.r[r.id] === 'n' ? 'no' : '';
  const sw = st.swap[r.id];
  const meta = `<dl class="meta"><dt>Рубрика</dt><dd>${esc(r.rub)} · ${esc(r.src)}</dd>
    ${full && r.dv ? `<dt>Тупой зритель</dt><dd>${r.dv[0]} → <b class="gold">${r.dv[1]}</b> из 10 <span class="mute">(первая версия → сейчас, порог 8)</span></dd>` : ''}
    ${full ? `<dt>Длина</dt><dd>≈ ${r.len} с</dd><dt>Плашка хука</dt><dd>${esc(r.hook_plate)}</dd><dt>Замысел</dt><dd>${esc(r.idea)}</dd>` : ''}
    <dt>В кадре</dt><dd>${r.chars.map(c => esc(PN[c] || c)).join(', ')}</dd>
    <dt>Живое</dt><dd>${esc(r.live)}</dd><dt>Повод написать</dt><dd>${esc(r.cta)}</dd>
    ${r.note ? `<dt>Важно</dt><dd>${esc(r.note)}</dd>` : ''}</dl>`;
  const body = full ? r.lines.map(lineHtml).join('')
    : `<dl class="brief"><dt>Хук</dt><dd>${esc(r.hook)}</dd><dt>Ход</dt><dd>${esc(r.flow)}</dd><dt>Финал</dt><dd>${esc(r.end)}</dd></dl>`;
  return `<div class="roll ${open} ${no}" id="r_${r.id}">
    <div class="rtop" data-open="${r.id}"><span class="arrow">▸</span><span class="rid">${r.id}</span>
      <div class="rt"><div class="t">${esc(sw || r.t)}</div><div class="m">${esc(r.rub)}${full ? ' · ≈ ' + r.len + ' с' : ''}${sw ? ' · замена' : ''}</div></div>${yn(r.id)}</div>
    <div class="rbody">${meta}${body}
      ${res.length ? `<div class="swap"><label>Заменить на запасной из этой рубрики</label><select data-swap="${r.id}"><option value="">— оставить «${esc(r.t)}» —</option>${res.map(x => `<option ${sw === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>` : ''}
      <div class="note"><textarea data-note="${r.id}" placeholder="Правка к ролику">${esc(st.note[r.id] || '')}</textarea></div>
    </div></div>`;
}

function renderBatches() {
  return DATA.batches.map(b => {
    const fl = DATA.full.filter(r => r.id[0] === String(b.n));
    const rolls = fl.length ? fl.map(r => rollHtml(r, true)) : DATA.brief.filter(r => r.b === b.n).map(r => rollHtml(r, false));
    return `<section class="batch" id="b${b.n}"><div class="bhead"><h2>Пачка ${b.n} · ${esc(b.name)}</h2><span class="mute">${esc(b.when)}</span></div>
      <p class="lead">${esc(b.why)}${fl.length ? ' Сценарии — целиком: реплики, кто говорит, что на экране.' : ' Кратко: хук, ход, финал — реплики после твоих правок к пачке 1.'}</p>
      <div class="chips">${b.rub.map(x => `<span class="chip">${esc(x[0])} <b>${x[1]}</b></span>`).join('')}</div>
      ${rolls.join('')}</section>`;
  }).join('');
}

function renderDzen() {
  return `<section id="dzen"><h2>Статьи Дзена — темы, которые берём</h2>
    <p class="lead">${DATA.dzen.length} из 30. Куда ушла тема — номер ролика; «—» — почему не взяли.</p>
    <div class="card">${DATA.dzen.map(d => `<div class="dz"><span class="n">${d.n}</span><span><a href="${d.url}" target="_blank" rel="noopener">${esc(d.title)}</a></span>
      <span class="to ${d.to ? '' : 'x'}">${d.to ? `<a href="#r_${d.to}" data-go="${d.to}">${d.to}</a>` : '— ' + esc(d.why)}</span></div>`).join('')}</div></section>`;
}

function renderQ() {
  return `<section id="q"><h2>Вопросы на завтра</h2><div class="grid2">${DATA.questions.map((q, i) => `<div class="card"><p style="margin-top:0">${esc(q)}</p>
    <textarea data-q="${i}" placeholder="Ответ">${esc(st.q[i] || '')}</textarea></div>`).join('')}</div></section>
    <footer>Собрано ${esc(DATA.built)}. </footer>`;
}

function render() {
  // каждый раздел — отдельно: ошибка в одном больше не оставляет страницу пустой (была одна шапка)
  const parts = [DATA.public ? renderIntro : renderAnswer, renderStyles, renderPers, renderBatches, renderDzen]
    .concat(DATA.public ? [] : [renderQ]);
  $('#app').innerHTML = parts.map(f => {
    try { return f(); } catch (e) { console.error(e); return `<section><p class="mute">Раздел не открылся: ${esc(e.message)}</p></section>`; }
  }).join('');
  summary();
}

function allRolls() { return DATA.full.concat(DATA.brief); }

function summary() {
  const rs = allRolls();
  const y = rs.filter(r => st.r[r.id] === 'y').length, n = rs.filter(r => st.r[r.id] === 'n').length;
  const s = st.style ? DATA.styles.find(x => x.id === st.style).name : 'не выбран';
  $('#sum').innerHTML = `Стиль: <b>${esc(s)}</b> · роликов: <b>${y}</b> да, <b>${n}</b> нет из ${rs.length}`;
}

function text() {
  const L = ['CryoOne · 30 роликов — мой выбор', ''];
  L.push('Стиль: ' + (st.style ? DATA.styles.find(x => x.id === st.style).name : 'не выбран'));
  DATA.batches.forEach(b => {
    L.push('', `Пачка ${b.n} · ${b.name}`);
    allRolls().filter(r => r.id.startsWith(b.n + '-')).forEach(r => {
      const v = st.r[r.id] === 'y' ? 'да' : st.r[r.id] === 'n' ? 'нет' : '—';
      L.push(`${r.id} [${v}] ${st.swap[r.id] ? st.swap[r.id] + ' (вместо «' + r.t + '»)' : r.t}`);
      if ((st.note[r.id] || '').trim()) L.push('   правка: ' + st.note[r.id].trim());
    });
  });
  const qa = DATA.questions.map((q, i) => [q, (st.q[i] || '').trim()]).filter(x => x[1]);
  if (qa.length) { L.push('', 'Ответы:'); qa.forEach(x => L.push('— ' + x[0], '  ' + x[1])); }
  return L.join('\n');
}

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1800); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-pick],[data-yn],[data-open],.shot[data-full],[data-go]');
  if (!t) return;
  if (t.dataset.view) { st.view = t.dataset.view; save(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (t.dataset.pick) { st.style = t.dataset.pick; save(); const y = window.scrollY; render(); window.scrollTo(0, y); toast('Стиль выбран'); }
  else if (t.dataset.yn) { e.stopPropagation(); const id = t.dataset.yn; st.r[id] = st.r[id] === t.dataset.v ? '' : t.dataset.v; save();
    const el = document.getElementById('r_' + id); el.querySelector('.yn').outerHTML = yn(id); el.classList.toggle('no', st.r[id] === 'n'); }
  else if (t.dataset.open) { const id = t.dataset.open; st.open[id] = !st.open[id]; save(); document.getElementById('r_' + id).classList.toggle('open', !!st.open[id]); }
  else if (t.dataset.go) { st.open[t.dataset.go] = true; save(); document.getElementById('r_' + t.dataset.go).classList.add('open'); }
  else if (t.dataset.full) { $('#lb img').src = t.dataset.full; $('#lb').classList.add('on'); }
});
$('#lb').addEventListener('click', () => $('#lb').classList.remove('on'));
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note) st.note[t.dataset.note] = t.value;
  else if (t.dataset.q) st.q[t.dataset.q] = t.value;
  else return;
  save();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset.swap) return;
  st.swap[t.dataset.swap] = t.value; save();
  const el = document.getElementById('r_' + t.dataset.swap);
  el.querySelector('.rt .t').textContent = t.value || allRolls().find(r => r.id === t.dataset.swap).t;
});
$('#copy').addEventListener('click', async () => {
  const s = text();
  try { await navigator.clipboard.writeText(s); toast('Скопировано'); }
  catch (e) { const a = document.createElement('textarea'); a.value = s; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); toast('Скопировано'); }
});
render();
</script>
</body>
</html>
