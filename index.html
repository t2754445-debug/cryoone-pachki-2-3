окупкой всегда переворачиваю вещь и смотрю, где сделано. С криокапсулой так не выйдет. Тяжёлая.", "role": "хук", "sign": "−", "screen": "Предприниматель с фонариком лежит на полу и заглядывает под капсулу · плашка «Где сделана капсула?»"}, {"who": "pr", "text": "О, табличка: «CryoOne, Санкт-Петербург». А кто там?", "role": "узнавание", "sign": "±", "screen": "крупно табличка с золотой снежинкой и «Санкт-Петербург»"}, {"who": "dm", "text": "Я, Дмитрий Зашихин, инженер-физик. Двадцать лет делаю вещи, которые морозят. Эта — новая процедура для вашей студии: гость две-три минуты стоит в кабине при минус ста восьмидесяти.", "role": "поворот", "sign": "+", "screen": "Дмитрий выходит из-за капсулы · подпись «Дмитрий Зашихин · основатель CryoOne» · живое видео В08 · плашка «2–3 минуты · −180 °C»"}, {"who": "pr", "text": "Минус сто восемьдесят — и выходит живой?", "role": "качели", "sign": "−", "screen": "Предприниматель косится на капсулу"}, {"who": "dm", "text": "Мороз поверхностный: охлаждает только верхний слой кожи. А гости приходят за этим: крепкий сон, меньше отёков, подтянутая кожа.", "role": "приём", "sign": "+", "screen": "плашки «только верхний слой кожи», «сон · отёки · кожа»"}, {"who": "pr", "text": "А собираете где? Или привезли и наклеили табличку?", "role": "качели", "sign": "−", "screen": "Предприниматель прищурился"}, {"who": "dm", "text": "Собираем сами, в нашем цехе в Петербурге: корпус, обивку, пульт.", "role": "приём", "sign": "+", "screen": "плашка-список «корпус · обивка · пульт — свой цех»"}, {"who": "pr", "text": "И сколько ждать мою?", "role": "качели", "sign": "−", "screen": "Предприниматель смотрит на часы"}, {"who": "live:38:41", "text": "Сам процесс производства от 20 рабочих дней.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «от 20 рабочих дней»"}, {"who": "pr", "text": "Ладно, собрали. А если через год сломается — вы где будете?", "role": "петля", "sign": "−", "screen": "Предприниматель скрестил руки"}, {"who": "dm", "text": "Там же, в Петербурге. Гарантия — год, а на ряд моделей два: вдвое дольше рынка. Сервис приедет к вам за один-три дня.", "role": "доказательство", "sign": "+", "screen": "плашки «гарантия 12–24 мес.» · «сервис — 1–3 дня»"}, {"who": "pr", "text": "Табличке верю. Но цех хочу увидеть сам.", "role": "качели", "sign": "±", "screen": "Предприниматель выключает фонарик"}, {"who": "dm", "text": "Приезжайте. Покажу цех, а потом зайдёте в капсулу сами.", "role": "финал", "sign": "+", "screen": "Дмитрий открывает дверцу капсулы · кнопка «Приезжайте на производство — напишите»"}]}, {"id": "1-02", "src": "Р03-1", "rub": "Сколько стоит", "t": "Что приезжает вместе с капсулой", "len": 57, "hook_plate": "Что входит в покупку: 0 / 8", "chars": ["pr", "mn"], "idea": "Распаковка грузовика по накладной: счётчик «0 / 8» собирается на экране и висит до конца. Цену не называем: кузов приезжает, когда капсула уже куплена; концовка — кто платит за доставку.", "cta": "Напишите — пришлём цены и комплектации", "live": "видео В11 (сосуд Дьюара) на «термос»; В16 (валенки) на «валенки»", "dv": [5, "6"], "lines": [{"who": "pr", "text": "Привезли криокапсулу. А в кузове ещё коробки. Это что, всё моё?", "role": "хук", "sign": "−", "screen": "Грузовик с золотой снежинкой у салона, коробки до потолка · плашка «Что входит в цену: 0 / 8»"}, {"who": "mn", "text": "Ваше. Я менеджер CryoOne, разбираем по накладной.", "role": "поворот", "sign": "±", "screen": "Менеджер с планшетом · счётчик «0 / 8»"}, {"who": "mn", "text": "Первое — сама капсула: в ней ваш гость две-три минуты бодрится холодом минус сто восемьдесят.", "role": "приём", "sign": "+", "screen": "капсула выезжает из кузова · счётчик «1 / 8» · плашка «2–3 минуты · −180 °C»"}, {"who": "mn", "text": "Второе — вот этот большой термос. Сосуд Дьюара: в нём хранят жидкий азот, азот и даёт холод.", "role": "приём", "sign": "+", "screen": "живое видео В11: сосуд крупно · счётчик «2 / 8»"}, {"who": "pr", "text": "Термос понял. А в этом мешке что?", "role": "качели", "sign": "−", "screen": "Предприниматель вытаскивает мягкий мешок"}, {"who": "mn", "text": "Третье — валенки и варежки для гостей. Четвёртое — пульт управления.", "role": "приём", "sign": "+", "screen": "живое видео В16 · валенки, варежки, пульт · счётчик «4 / 8»"}, {"who": "pr", "text": "А собирать кто будет? У меня одна отвёртка, и та от очков.", "role": "качели", "sign": "−", "screen": "Предприниматель с крошечной отвёрткой над огромной коробкой"}, {"who": "mn", "text": "Соберём мы. Пятое — монтаж: наши сборщики ставят капсулу за один день. Шестое — обучение вашего администратора, пятнадцать минут.", "role": "доказательство", "sign": "+", "screen": "сборщики CryoOne с инструментом · счётчик «6 / 8» · плашки «монтаж — 1 день» · «обучение — 15 минут»"}, {"who": "mn", "text": "Седьмое — гарантия: год, а на ряд моделей два. Восьмое — поставщиков азота в вашем городе ищем мы.", "role": "приём", "sign": "+", "screen": "список целиком · счётчик «8 / 8»"}, {"who": "pr", "text": "Восемь из восьми. А грузовик чей? За него сколько?", "role": "петля", "sign": "−", "screen": "Предприниматель заглядывает в пустой кузов, водитель протягивает накладную"}, {"who": "mn", "text": "Грузовик не наш. Доставку оплачиваете перевозчику напрямую и выбираете его сами, как удобно. Мы на ней не зарабатываем.", "role": "доказательство", "sign": "+", "screen": "плашка «доставка — перевозчику напрямую, без нашей наценки»"}, {"who": "pr", "text": "Всё моё, кроме грузовика. И отвёртку покупать не придётся.", "role": "финал", "sign": "+", "screen": "Предприниматель ставит валенки на стойку администратора · список висит · кнопка «Напишите — пришлём цены и комплектации»"}]}, {"id": "1-03", "src": "Р03-4", "rub": "Сколько стоит", "t": "Платёж — одна-две процедуры в день", "len": 53, "hook_plate": "Сколько гостей — на платёж?", "chars": ["pr", "dm", "mn"], "idea": "Страшную сумму переводим в людей, которые и так ходят в студию: «двое из сорока». Рассрочка и лизинг — да, сумму платежа в кадр не выводим.", "cta": "Напишите — посчитаем платёж под ваш город и модель", "live": "видео В05 (гостья в капсуле: «комфортно, нормально») на «выходит бодрым»", "dv": [7, "7"], "lines": [{"who": "pr", "text": "Через мою студию в день проходит сорок человек. Сколько из них должны зайти в криокапсулу, чтобы она сама за себя платила?", "role": "хук", "sign": "±", "screen": "Предприниматель у стойки, мимо идут гости, над дверью счётчик «40» · плашка «Сколько гостей — на платёж?»"}, {"who": "dm", "text": "Посчитаем. Сеанс в капсуле — две-три минуты холода, а гости приходят сразу за многим: бодрость, крепкий сон, подтянутая кожа, восстановление после тренировок. Платят за это от двух с половиной до шести тысяч рублей.", "role": "поворот", "sign": "+", "screen": "Дмитрий с блокнотом · живое видео В05 · плашки «бодрость · сон · кожа · восстановление» · «сеанс — 2 500–6 000 ₽»"}, {"who": "pr", "text": "Но саму капсулу надо оплатить сразу. Целиком.", "role": "качели", "sign": "−", "screen": "Предприниматель выворачивает пустой карман"}, {"who": "mn", "text": "Я менеджер CryoOne. Сразу — необязательно. Есть наша рассрочка, есть банк, есть лизинг. Если ничего не подходит — посчитаем схему под вас.", "role": "приём", "sign": "+", "screen": "Менеджер · плашка-список «рассрочка CryoOne · банк · лизинг · свой расчёт»"}, {"who": "pr", "text": "И сколько гостей нужно на такой платёж?", "role": "качели", "sign": "−", "screen": "Предприниматель смотрит на пустой календарь"}, {"who": "dm", "text": "Месячный платёж по рассрочке закрывают одна-две такие процедуры в день. Каждый следующий гость, за вычетом азота для капсулы, — уже ваш доход.", "role": "доказательство", "sign": "+", "screen": "в каждом дне календаря загораются две золотые снежинки, остальное — зелёным · плашка «платёж = 1–2 процедуры в день»"}, {"who": "pr", "text": "А если во вторник никто не придёт?", "role": "петля", "sign": "−", "screen": "Предприниматель смотрит на пустой вторник"}, {"who": "dm", "text": "Платёж месячный. Пустой вторник закроет суббота.", "role": "приём", "sign": "+", "screen": "в календаре суббота загорается четырьмя снежинками"}, {"who": "pr", "text": "Двое из сорока? У меня на утреннюю растяжку столько опаздывает.", "role": "финал", "sign": "+", "screen": "Предприниматель смеётся, в дверь вбегают двое опоздавших · кнопка «Напишите — посчитаем платёж под ваш город»"}]}, {"id": "1-04", "src": "Р12-1", "rub": "Азот без загадок", "t": "Вы и сейчас дышите азотом", "len": 52, "hook_plate": "3 страха про азот", "chars": ["pr", "dm"], "idea": "Разбор трёх страхов со штампом «проверено». На втором страхе предприниматель задерживает дыхание и держит его до конца ролика. Четвёртый вопрос — «где брать» — уходит в следующий ролик серии.", "cta": "Напишите город — найдём поставщиков азота рядом с вами", "live": "П23 (78 % воздуха), П25 (большой термос); видео В11 (сосуд Дьюара крупно)", "dv": [6, "7"], "lines": [{"who": "pr", "text": "Криокапсула работает на жидком азоте. Я про азот знаю три вещи: взрывается, травит и хранить его негде.", "role": "хук", "sign": "−", "screen": "Предприниматель пятится от сосуда · три карточки на стене · плашка «3 страха про азот»"}, {"who": "dm", "text": "Проверим все три. Сначала — зачем он. В кабине жидкий азот превращается в холодный пар, и гость две-три минуты стоит в этом паре при минус ста восьмидесяти.", "role": "поворот", "sign": "+", "screen": "Дмитрий со штампом «ПРОВЕРЕНО» · плашка «2–3 минуты · −180 °C»"}, {"who": "dm", "text": "Страх первый: рванёт. Азот не горит и не взрывается. Им даже тушат пожары.", "role": "приём", "sign": "+", "screen": "штамп на карточке «взрывается» · плашка «не горит · не взрывается»"}, {"who": "pr", "text": "Хорошо. А надышаться им можно?", "role": "качели", "sign": "−", "screen": "Предприниматель прикрывает нос"}, {"who": "live:П23", "text": "Мы с тобой дышим — сейчас вот в воздухе азота где-то порядка 78 %.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «78 % воздуха — азот»"}, {"who": "pr", "text": "Тогда я на всякий случай пока не дышу.", "role": "качели", "sign": "−", "screen": "Предприниматель надувает щёки и задерживает дыхание"}, {"who": "dm", "text": "Второй страх тоже мимо, дышите. Голова гостя в капсуле всегда над паром: он дышит тем же воздухом комнаты, что и вы. Страх третий: где азот держать.", "role": "приём", "sign": "±", "screen": "штамп на второй карточке · схема: голова над паром · предприниматель всё ещё не дышит"}, {"who": "live:П25", "text": "И жидкий азот, он хранится в сосудах Дьюара — это такой большой термос.", "role": "доказательство", "sign": "+", "screen": "живое видео В11: сосуд крупно"}, {"who": "dm", "text": "Сосуд стоит рядом с капсулой. Бочек в подвале не будет.", "role": "приём", "sign": "+", "screen": "штамп на третьей карточке · плашка «сосуд — рядом с капсулой»"}, {"who": "pr", "text": "А где… его… брать?", "role": "петля", "sign": "−", "screen": "Предприниматель, красный, говорит сквозь надутые щёки"}, {"who": "dm", "text": "Заводы в вашем городе обзвоним мы и пришлём список. А теперь выдыхайте.", "role": "финал", "sign": "+", "screen": "Предприниматель шумно выдыхает · три карточки со штампом · кнопка «Напишите город — найдём азот рядом»"}]}, {"id": "1-05", "src": "Р12-3", "rub": "Азот без загадок", "t": "Азот в вашем городе ищем мы", "len": 53, "hook_plate": "Где взять азот?", "chars": ["pr", "mn"], "idea": "Квест «найди азот»: три звонка на заводы, три провала. Менеджер присылает готовый список. Финал возвращается к третьему заводу из хука.", "cta": "Напишите город — пришлём поставщиков азота рядом", "live": "видео В11 (сосуд Дьюара) на «сосуд»", "dv": [4, "5–6"], "lines": [{"who": "pr", "text": "Ищу жидкий азот. Три завода обзвонил. Первый не берёт трубку. Второй продаёт азот цистернами. Третий спросил, зачем мне азот.", "role": "хук", "sign": "−", "screen": "Предприниматель с телефоном, три зачёркнутых номера · плашка «Где взять азот?»"}, {"who": "pr", "text": "Говорю: для криокапсулы. А он: «Для чего?»", "role": "узнавание", "sign": "−", "screen": "на экране телефона — «вызов завершён»"}, {"who": "mn", "text": "Для того, чтобы гостей в кабине бодрил холод минус сто восемьдесят. Я менеджер CryoOne, и искать азот — наша работа.", "role": "поворот", "sign": "+", "screen": "Менеджер в гарнитуре · лого в углу"}, {"who": "pr", "text": "Ваша? Вы в Петербурге, а я за полторы тысячи километров.", "role": "качели", "sign": "−", "screen": "карта: Петербург и город далеко"}, {"who": "mn", "text": "Заводы в вашем регионе мы обзваниваем сами. И присылаем список: цена за литр, кто привезёт азот или где заправить сосуд — большой термос, который приходит с капсулой.", "role": "приём", "sign": "+", "screen": "плашка-список «цена за литр · кто привезёт · где заправить» · живое видео В11"}, {"who": "pr", "text": "А литр почём? Вдруг у нас он золотой.", "role": "качели", "sign": "−", "screen": "Предприниматель держит воображаемый золотой слиток"}, {"who": "mn", "text": "Смотря какой завод рядом: где-то литр стоит тридцать рублей, где-то триста. Поэтому до договора считаем, во что вам обойдётся один сеанс с вашим азотом.", "role": "доказательство", "sign": "+", "screen": "плашка «30–300 ₽ за литр» · Менеджер с ноутбуком · плашка «Расчёт сеанса — до договора»"}, {"who": "pr", "text": "Список беру. А третьему заводу перезвоню — теперь объясню ему, для чего.", "role": "финал", "sign": "+", "screen": "Предприниматель набирает номер, улыбаясь · кнопка «Напишите город — пришлём поставщиков»"}]}, {"id": "1-06", "src": "Р13-1 + Р13-2", "rub": "Помещение", "t": "Метр на два и обычная розетка", "len": 55, "hook_plate": "Сколько места нужно?", "chars": ["pr", "dm"], "idea": "Предприниматель обвёл на полу скотчем место под капсулу — как на месте преступления. Габариты и розетка — живым голосом Дмитрия; фикус уезжает в коридор.", "cta": "Пришлите размеры комнаты — нарисуем план с капсулой", "live": "П21 (метр на два, 2,20), П27 (розетка, 1,5 кВт); видео В15 (капсула в комнате) на финале", "dv": [4, "7"], "lines": [{"who": "pr", "text": "Я обвёл на полу скотчем место под криокапсулу. Теперь гости спрашивают, кого тут нашли.", "role": "хук", "sign": "±", "screen": "контур из скотча на полу, как на месте преступления · плашка «Сколько места нужно?»"}, {"who": "dm", "text": "Никого. Здесь встанет криокапсула: гость заходит в неё на две-три минуты холода и выходит бодрым. Места ей нужно ровно столько.", "role": "поворот", "sign": "+", "screen": "Дмитрий у контура · плашка «2–3 минуты · −180 °C»"}, {"who": "live:П21", "text": "Оборудование под себя занимает метр на два, в высоту оно 2,20, поэтому даже можно поставить, не знаю, в какую-нибудь хрущёвку без проблем.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашки «1 × 2 м», «высота 2,20 м»"}, {"who": "pr", "text": "Метр на два нашёл, там фикус. Но электрик говорит, под такую штуку надо тянуть отдельную линию.", "role": "качели", "sign": "−", "screen": "Предприниматель у огромного фикуса, электрик с мотком кабеля"}, {"who": "live:П27", "text": "Оборудование включается в обычную бытовую розетку, туда, куда мы можем включить чайник… потребляемая мощность полтора киловатта.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «обычная розетка · 1,5 кВт»"}, {"who": "pr", "text": "Полтора киловатта? Мой фен в подсобке берёт больше.", "role": "качели", "sign": "±", "screen": "Электрик молча уносит кабель"}, {"who": "pr", "text": "А сосуд с азотом куда? Ему тоже угол нужен?", "role": "петля", "sign": "−", "screen": "Предприниматель оглядывает тесную комнату"}, {"who": "dm", "text": "Сосуд ставят рядом с капсулой. Поэтому комнату советуем от восьми квадратных метров: капсула, сосуд и место, где гость переоденется.", "role": "приём", "sign": "+", "screen": "план комнаты сверху · плашка «комната от 8 м²»"}, {"who": "pr", "text": "Значит, фикус едет в коридор. А скотч оставлю — пусть гадают.", "role": "финал", "sign": "+", "screen": "фикус выезжает, в контуре встаёт капсула · живое видео В15 · кнопка «Пришлите размеры — нарисуем план»"}]}, {"id": "1-07", "src": "Р03-3", "rub": "Сколько стоит", "t": "Как выбрать капсулу: четыре вопроса продавцу", "len": 56, "hook_plate": "Сохраните: 4 вопроса продавцу", "chars": ["pr", "mn"], "idea": "Капсулу «с рук за полцены» проверяют как подержанную машину: четыре вопроса собираются на экране и висят до конца. Вопросы годятся для любого продавца, и для нас тоже. Основа — чек-лист CryoOne против Б/У; его цифры в кадр не идут, конкурентов не называем. Заменил 1-07 «Пять проверок комнаты».", "cta": "Напишите — пришлём чек-лист проверки любой капсулы", "live": "видео В10 или В13 (новая капсула) на финале; живого Б/У нет — рисуем", "dv": null, "lines": [{"who": "pr", "text": "Мне предлагают криокапсулу за полцены. С рук, «почти новая». Беру?", "role": "хук", "sign": "±", "screen": "Продавец в тёмных очках хлопает по потёртой капсуле · плашка «Сохраните: 4 вопроса продавцу»"}, {"who": "mn", "text": "Я менеджер CryoOne. Сначала задайте продавцу четыре вопроса. Любому продавцу, и нам тоже.", "role": "поворот", "sign": "+", "screen": "Менеджер с листком · счётчик «0 / 4»"}, {"who": "mn", "text": "Первый — сколько процедур на счётчике. Это пробег капсулы. Если у старой капсулы на счётчике ноль, пробег скрывают.", "role": "приём", "sign": "+", "screen": "крупно счётчик «0000» на потёртом пульте · счётчик «1 / 4»"}, {"who": "pr", "text": "Продавец говорит, счётчик сам сбросился.", "role": "качели", "sign": "−", "screen": "Продавец отворачивается и насвистывает"}, {"who": "mn", "text": "Второй — сколько уходит азота. Капсула морозит жидким азотом: гость две-три минуты стоит в холоде, голова снаружи. Старая изоляция пропускает холод, и азота уходит больше — каждый день, вашими деньгами.", "role": "приём", "sign": "+", "screen": "иней на шлангах, из шланга вместо пара вылетают купюры · плашка «2–3 минуты · −180 °C» · счётчик «2 / 4»"}, {"who": "mn", "text": "Третий — кто соберёт и запустит. Монтаж — последний этап производства. А продавец с рук после сделки обычно пропадает.", "role": "приём", "sign": "+", "screen": "рукопожатие — продавец растворяется в воздухе, капсула в ящиках у двери · счётчик «3 / 4»"}, {"who": "pr", "text": "А четвёртый? Только не про гарантию — её мне обещали.", "role": "петля", "sign": "−", "screen": "Предприниматель машет обещанием на салфетке"}, {"who": "mn", "text": "Про неё. Гарантию обычно дают первому владельцу. Позвоните производителю, назовите серийный номер и спросите, перейдёт ли она к вам.", "role": "доказательство", "sign": "+", "screen": "плашка «гарантия — к вам или только первому владельцу?» · счётчик «4 / 4»"}, {"who": "pr", "text": "Позвонил. Сказали: «Вы не первый владелец». Пойду задавать четыре вопроса новой.", "role": "финал", "sign": "+", "screen": "Предприниматель с телефоном у новой капсулы, список висит · кнопка «Напишите — пришлём чек-лист проверки»"}]}, {"id": "1-08", "src": "Р14-1 + Р14-2", "rub": "Кто будет вести процедуру", "t": "Обучение за 15 минут", "len": 56, "hook_plate": "Обучение — 15 минут", "chars": ["ad", "dm", "kl"], "idea": "Таймер обучения на 15 минут тикает весь ролик — петля. Администратор засекает время сама и укладывается в 11 минут, запустив первую гостью.", "cta": "Напишите — расскажем, как проходит обучение", "live": "П35 (пульт как от телевизора); видео В16 (валенки надевают), В08 (оператор с пультом)", "dv": [5, "7"], "lines": [{"who": "ad", "text": "Мне сказали: через пятнадцать минут ты ведёшь процедуры в криокапсуле. Засекаю.", "role": "хук", "sign": "−", "screen": "Администратор нажимает секундомер «15:00» · плашка «Обучение — 15 минут»"}, {"who": "dm", "text": "Успеем. Я Дмитрий, CryoOne. Гость заходит в кабину, вы закрываете дверцу, две-три минуты холода — и он выходит бодрым. Ваше дело — встретить, одеть и запустить.", "role": "поворот", "sign": "+", "screen": "Дмитрий рядом, добродушно · таймер «13:40»"}, {"who": "ad", "text": "Одеть? Во что?", "role": "качели", "sign": "−", "screen": "Администратор растерянно смотрит на капсулу"}, {"who": "dm", "text": "Гость в белье, на ногах валенки, на руках варежки. Всё это лежит в комплекте.", "role": "приём", "sign": "+", "screen": "живое видео В16 · таймер «11:20»"}, {"who": "ad", "text": "А кнопок там много? Я с кофемашиной еле справляюсь.", "role": "качели", "sign": "−", "screen": "Администратор косится на пульт"}, {"who": "live:П35", "text": "Оборудование управляется с пульта дистанционного управления, как от телевизора пульт, есть минимум кнопок.", "role": "доказательство", "sign": "+", "screen": "живое видео В08: оператор с пультом · таймер «9:05»"}, {"who": "ad", "text": "А о чём с гостьей говорить все три минуты? Я же молчать не умею.", "role": "качели", "sign": "−", "screen": "Администратор шёпотом"}, {"who": "dm", "text": "И не молчите: капсула работает тихо, болтайте всю процедуру. Выйти гость может в любой момент: дверь изнутри открывается легче, чем снаружи. А что сказать перед входом — в памятке, она в комплекте.", "role": "приём", "sign": "+", "screen": "плашка «памятка для администратора — в комплекте» · таймер «6:30»"}, {"who": "ad", "text": "Ладно. Первая гостья, заходим.", "role": "петля", "sign": "±", "screen": "Администратор закрывает дверцу, жмёт кнопку · таймер «5:10»"}, {"who": "kl", "text": "Ой, холодно!.. Слушайте, а бодрит. Я ещё приду.", "role": "панч", "sign": "+", "screen": "Клиентка выходит из пара, сияет"}, {"who": "ad", "text": "Обучение — одиннадцать минут вместо пятнадцати. Четыре — на кофе.", "role": "финал", "sign": "+", "screen": "Администратор останавливает таймер «4:00» · кнопка «Напишите — расскажем про обучение»"}]}, {"id": "1-09", "src": "Р14-3", "rub": "Кто будет вести процедуру", "t": "Медика в штат искать не нужно", "len": 50, "hook_plate": "Кто будет вести процедуру?", "chars": ["pr", "ad", "dm"], "idea": "Вакансия «медобразование обязательно» висит три месяца, а администратор предлагает вычеркнуть два слова. Дмитрий объясняет, почему можно: тренажёрный комплекс, ОКВЭД подберёт юрист.", "cta": "Напишите — расскажем, кто и как ведёт процедуру", "live": "видео В03 (голос оператора: «если что-то будет некомфортно, обязательно говорим»)", "dv": [6, "7–8"], "lines": [{"who": "pr", "text": "Третий месяц висит вакансия: «Оператор криокапсулы, медобразование обязательно». Откликов — ноль.", "role": "хук", "sign": "−", "screen": "Предприниматель у доски с вакансией, по углам паутина · плашка «Кто будет вести процедуру?»"}, {"who": "ad", "text": "Так вычеркните последние два слова. Я ваш администратор, я бы и сама пошла.", "role": "поворот", "sign": "+", "screen": "Администратор из-за стойки, с маркером"}, {"who": "pr", "text": "Нельзя. Там же холод минус сто восемьдесят!", "role": "качели", "sign": "−", "screen": "Предприниматель закрывает вакансию собой"}, {"who": "dm", "text": "Можно. Я Дмитрий, CryoOne. Две-три минуты холода для бодрости — процедура не медицинская. Капсула сертифицирована как тренажёрный комплекс, как оборудование фитнес-зала. Поэтому ведёт её ваш администратор, мы его обучим.", "role": "приём", "sign": "+", "screen": "плашки «тренажёрный комплекс» · «без медобразования» · живое видео В03"}, {"who": "pr", "text": "А лицензии? Коды? Проверки?", "role": "петля", "sign": "−", "screen": "на предпринимателя падает гора папок"}, {"who": "dm", "text": "Нужен правильный код деятельности, ОКВЭД. Его подберёт наш юрист, он входит в покупку.", "role": "доказательство", "sign": "+", "screen": "папки разлетаются · плашка «ОКВЭД подберёт юрист CryoOne»"}, {"who": "pr", "text": "И сколько я буду всё это оформлять? Полгода?", "role": "качели", "sign": "−", "screen": "Предприниматель смотрит на календарь"}, {"who": "dm", "text": "Несколько дней. Пока капсулу собирают в цеху, бумаги уже готовы.", "role": "доказательство", "sign": "+", "screen": "плашка «оформление — несколько дней»"}, {"who": "pr", "text": "Снимаю вакансию.", "role": "качели", "sign": "+", "screen": "Администратор вычёркивает «медобразование обязательно»"}, {"who": "ad", "text": "А теперь давайте обсудим мою новую должность.", "role": "финал", "sign": "+", "screen": "Администратор с пультом, хитро улыбается · кнопка «Напишите — расскажем, кто ведёт процедуру»"}]}, {"id": "1-10", "src": "Р15-1 + П33", "rub": "Команда за спиной покупателя", "t": "Страшный сон: купил капсулу, а гостей нет", "len": 55, "hook_plate": "А если гостей не будет?", "chars": ["pr", "dm", "mn"], "idea": "Кошмар покупателя разбираем по частям, как сон: пустой зал, «свои уже всё попробовали», «я не маркетолог». Крио ставят в работающий бизнес, запуск ведут маркетологи.", "cta": "Напишите — расскажем, как ведём запуск", "live": "П33 («клиента не бросаем в чистом поле»)", "dv": [5, "7"], "lines": [{"who": "pr", "text": "Мне снится один сон. Я купил криокапсулу, а гостей нет. Она стоит в инее, и в ней живёт паук.", "role": "хук", "sign": "−", "screen": "Капсула в инее и паутине, пустой зал, эхо · плашка «А если гостей не будет?»"}, {"who": "dm", "text": "Просыпайтесь. Разберём ваш сон по частям.", "role": "поворот", "sign": "+", "screen": "Дмитрий щёлкает пальцами — паутина исчезает"}, {"who": "dm", "text": "Во сне капсула стоит в пустом зале. На деле её ставят туда, где люди уже ходят, и две-три минуты холода вы предлагаете своим же гостям.", "role": "приём", "sign": "+", "screen": "пустой зал наполняется гостями студии · плашка «крио — к работающему бизнесу»"}, {"who": "pr", "text": "Своих у меня двести. Они у меня уже всё перепробовали.", "role": "качели", "sign": "−", "screen": "Предприниматель листает базу гостей"}, {"who": "dm", "text": "Холода они у вас ещё не пробовали. Одно сообщение по базе — и у гостей, которые пропали, есть повод вернуться.", "role": "приём", "sign": "+", "screen": "плашка «одно сообщение по базе»"}, {"who": "pr", "text": "А новых где брать? Я не маркетолог.", "role": "качели", "sign": "−", "screen": "Предприниматель вздыхает"}, {"who": "mn", "text": "Я менеджер CryoOne, а за мной — наши маркетологи. Первый месяц созваниваемся каждую неделю и даём план: день открытых дверей, рассылка, сторис, где гости выходят из пара.", "role": "приём", "sign": "+", "screen": "плашка-список по неделям, пункты закрашиваются золотом"}, {"who": "pr", "text": "Месяц. А потом бросите?", "role": "петля", "sign": "−", "screen": "Предприниматель с недоверием"}, {"who": "live:П33", "text": "…клиента не бросаем в чистом поле.", "role": "доказательство", "sign": "+", "screen": "его кадр · лого"}, {"who": "dm", "text": "Студия растяжки в Калининграде тоже боялась пустого зала. А через месяц докупала сосуды для азота: гостей стало столько, что одного не хватало.", "role": "доказательство", "sign": "+", "screen": "карта: Калининград · сосуды приезжают вторым рейсом"}, {"who": "pr", "text": "Этот сон мне нравится больше.", "role": "финал", "sign": "+", "screen": "тот же зал — светлый, у капсулы очередь · кнопка «Напишите — расскажем про запуск»"}]}, {"id": "2-01", "b": 2, "src": "Р05-4, серия 1", "rub": "Доводы для главврача", "t": "Две капсулы ломались. Серия 1: почему меняли", "len": 58, "hook_plate": "Капсула снова встала. Почему?", "chars": ["pg", "kl", "ad"], "idea": "Кейс Соль-Илецка журналом отделения: страница за страницей — «ремонт», «ждём мастера». Ложная надежда на мастера, удар — встала вторая. Финал — три вопроса в заявку тендера, ответы на них — во второй серии.", "cta": "Напишите — расскажем, как работает сервис", "live": "видео В08 (оператор с пультом, гости входят и выходят) на «за этим к нам и едут»", "note": "производителя прежних капсул не называем; «пациенты» не говорим — гости", "dv": [6, "6"], "lines": [{"who": "pg", "text": "Журнал криокапсул нашего отделения. Понедельник — «ремонт». Среда — «ждём мастера». Пятница — снова «ремонт».", "role": "хук", "sign": "−", "screen": "Помощник главврача листает журнал, на каждой странице красное «ремонт» · плашка «Капсула снова встала. Почему?»"}, {"who": "pg", "text": "Я помощник главврача, Соль-Илецк. У нас две криокапсулы: гость две-три минуты стоит в холоде минус сто восемьдесят градусов, голова снаружи, и выходит бодрым. Гости едут к нам и за этим.", "role": "поворот", "sign": "+", "screen": "коридор отделения, у двери очередь гостей в халатах · живое видео В08 · плашка «2–3 минуты · −180 °C»"}, {"who": "kl", "text": "Я записана на десять. Почему на двери капсулы бумажка «не работает»?", "role": "качели", "sign": "−", "screen": "Клиентка в халате и валенках перед закрытой дверью"}, {"who": "ad", "text": "Сломалась. Вторая работает, но к ней очередь до обеда.", "role": "качели", "sign": "−", "screen": "Администратор разводит руками, очередь растёт"}, {"who": "pg", "text": "Звоним производителю. Мастер приедет через неделю. Ладно, переживём.", "role": "качели", "sign": "±", "screen": "Помощник главврача обводит дату в календаре"}, {"who": "ad", "text": "Приехал, починил, уехал. А через месяц встала вторая капсула.", "role": "качели", "sign": "−", "screen": "вторая капсула гаснет, журнал снова «ремонт»"}, {"who": "pg", "text": "Каждый день простоя — гости, которые уехали без процедуры, и деньги, которые отделение не заработало.", "role": "узнавание", "sign": "−", "screen": "страницы журнала летят, на каждой — «простой»"}, {"who": "pg", "text": "Главврач закрыл журнал и сказал одно слово: «Меняем».", "role": "поворот", "sign": "+", "screen": "журнал захлопывается"}, {"who": "ad", "text": "На что меняем? Вдруг новая будет ломаться так же.", "role": "петля", "sign": "−", "screen": "Администратор с сомнением"}, {"who": "pg", "text": "Поэтому — тендер. И в заявку пишем то, что нас подвело: кто чинит, как быстро приезжает, сколько гарантия.", "role": "приём", "sign": "+", "screen": "заявка: три пункта встают списком и висят"}, {"who": "pg", "text": "Последняя запись: «Объявляем тендер». Кто его выиграл — в следующей серии.", "role": "финал", "sign": "+", "screen": "запись в журнале золотом · титр «Кто выиграл — в серии 2» · кнопка «Напишите — расскажем, как работает сервис»"}]}, {"id": "2-02", "b": 2, "src": "Р05-4, серия 2", "rub": "Доводы для главврача", "t": "Две капсулы ломались. Серия 2: третья уже CryoOne", "len": 60, "hook_plate": "Что решило тендер: 0 / 4", "chars": ["pg", "dm"], "idea": "Три вопроса из заявки первой серии плюс четвёртый — «кто будет вести» — закрываются галочками, счётчик «0 / 4» висит до конца. Финал — запись «Третья капсула. Работает», дальше страницы пустые.", "cta": "Напишите — расскажем, как работает сервис", "live": "видео В08 (оператор с пультом, гости входят и выходят) на «ведёт администратор»", "note": "производителя прежних капсул не называем; ТЗ и описание под модель — в 2-03, здесь не повторяем", "dv": [5, "7"], "lines": [{"who": "pg", "text": "Тендер объявлен. В заявке три вопроса: кто чинит, как быстро приезжает, сколько гарантия. Третья капсула не должна встать, как первые две.", "role": "хук", "sign": "±", "screen": "Помощник главврача с заявкой, рядом две тёмные капсулы · плашка «Что решило тендер: 0 / 4»"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем криокапсулы в Петербурге: две-три минуты холода, и гость выходит бодрым. Отвечаю на заявку по пунктам.", "role": "поворот", "sign": "+", "screen": "Дмитрий у новой капсулы с золотой снежинкой · плашка «2–3 минуты · −180 °C»"}, {"who": "dm", "text": "Кто чинит — мы сами, производитель. Позвонить в поддержку можно в любое время суток.", "role": "приём", "sign": "+", "screen": "галочка на первом пункте · счётчик «1 / 4» · плашка «поддержка 24/7»"}, {"who": "pg", "text": "Нам тоже обещали. А мастер ехал неделю.", "role": "качели", "sign": "−", "screen": "Помощник главврача недоверчиво листает старый журнал"}, {"who": "dm", "text": "Наш сервис приезжает за один-три дня. Если нужно — приеду сам.", "role": "доказательство", "sign": "+", "screen": "галочка на втором пункте · счётчик «2 / 4» · плашка «выезд — 1–3 дня»"}, {"who": "pg", "text": "А гарантия? Прошлую мы так и не увидели.", "role": "качели", "sign": "−", "screen": "Помощник главврача стучит ручкой по заявке"}, {"who": "dm", "text": "Двенадцать месяцев, на ряд моделей двадцать четыре: вдвое дольше рынка.", "role": "доказательство", "sign": "+", "screen": "галочка на третьем пункте · счётчик «3 / 4» · плашка «гарантия 12–24 мес.»"}, {"who": "pg", "text": "И четвёртый вопрос, его добавил главврач: кто будет вести процедуры? Отдельного специалиста у нас нет.", "role": "петля", "sign": "−", "screen": "Помощник главврача дописывает четвёртый пункт"}, {"who": "dm", "text": "Капсула сертифицирована как тренажёрный комплекс — как тренажёры в фитнес-зале. Процедура не медицинская, поэтому вести её может ваш администратор.", "role": "приём", "sign": "+", "screen": "плашка «тренажёрный комплекс · ведёт администратор» · живое видео В08"}, {"who": "pg", "text": "А учить его сколько? Месяц?", "role": "качели", "sign": "−", "screen": "Помощник главврача смотрит на календарь"}, {"who": "dm", "text": "Пятнадцать минут. И монтаж — один день.", "role": "доказательство", "sign": "+", "screen": "галочка на четвёртом пункте · счётчик «4 / 4» · плашка «обучение — 15 минут · монтаж — 1 день»"}, {"who": "pg", "text": "Новая запись в журнале: «Третья капсула. Работает». Дальше страницы пустые.", "role": "финал", "sign": "+", "screen": "журнал: одна строка, дальше белые страницы · кнопка «Напишите — расскажем, как работает сервис»"}]}, {"id": "2-03", "b": 2, "src": "Р06-1", "rub": "Закупка до конца года", "t": "Деньги на оборудование есть, до декабря три месяца", "len": 55, "hook_plate": "Успеть до 31 декабря", "chars": ["pg", "mn"], "idea": "Обратный отсчёт: листки календаря слетают весь ролик, от «90 дней» до 31 декабря. На каждый страх — закупка, производство, монтаж — свой срок. Финал — последний листок отрывают спокойно.", "cta": "Напишите — пришлём описание и ТЗ для закупки", "live": "видео В10 (сенсорная панель) на «капсула стоит»", "dv": [7, "8"], "lines": [{"who": "pg", "text": "Деньги на оборудование есть. Не потратим до тридцать первого декабря — заберут. Осталось девяносто дней.", "role": "хук", "sign": "−", "screen": "Помощник главврача у отрывного календаря «90 дней» · плашка «Успеть до 31 декабря»"}, {"who": "mn", "text": "Я менеджер CryoOne. Успеете. Криокапсула — кабина, где гость две-три минуты стоит в холоде минус сто восемьдесят градусов, голова снаружи, и выходит бодрым.", "role": "поворот", "sign": "+", "screen": "Менеджер с ноутбуком · плашка «2–3 минуты · −180 °C»"}, {"who": "pg", "text": "Мне закупку оформлять, а я даже не знаю, как эту капсулу описать в заявке.", "role": "качели", "sign": "−", "screen": "Помощник главврача над пустым бланком закупки"}, {"who": "mn", "text": "Описание под модель и техническое задание для закупки пишем мы. Вам остаётся вставить их в документы.", "role": "приём", "sign": "+", "screen": "в бланк влетают готовые страницы · листки календаря слетают · плашка «описание и ТЗ — от CryoOne»"}, {"who": "pg", "text": "Хорошо, закупку провели. А делать её сколько? Вдруг полгода.", "role": "качели", "sign": "−", "screen": "календарь «60 дней»"}, {"who": "mn", "text": "Производство — от двадцати рабочих дней. Это месяц, и запас до праздников остаётся.", "role": "доказательство", "sign": "+", "screen": "плашка «производство — от 20 рабочих дней» · листки слетают"}, {"who": "pg", "text": "А монтаж? Бригада, пыль, отделение закрыто на месяц?", "role": "петля", "sign": "−", "screen": "Помощник главврача закрывает глаза"}, {"who": "mn", "text": "Монтаж — один день, отделение работает как обычно. В тот же день учим администратора: пятнадцать минут.", "role": "доказательство", "sign": "+", "screen": "бригада заносит капсулу и уходит до вечера · плашка «монтаж — 1 день · обучение — 15 минут»"}, {"who": "pg", "text": "Двадцатое декабря. Капсула стоит, администратор обучена.", "role": "доказательство", "sign": "+", "screen": "живое видео В10 · календарь «11 дней»"}, {"who": "pg", "text": "Тридцать первое. Отрываю последний листок — спокойно.", "role": "финал", "sign": "+", "screen": "последний листок плавно падает · кнопка «Напишите — пришлём описание и ТЗ для закупки»"}]}, {"id": "2-04", "b": 2, "src": "Р07-1", "rub": "Фитнес-клуб", "t": "Три сета — и в капсулу, завтра снова в зал", "len": 52, "hook_plate": "Куда пропадают клиенты после ног?", "chars": ["tr", "kl"], "idea": "Разделённый экран: слева клиентка после дня ног три дня дома, абонемент простаивает; справа она же после капсулы завтра снова в зале. Тренер в финале пишет в журнал «завтра снова ноги».", "cta": "Напишите — посчитаем капсулу для вашего клуба", "live": "видео В02 (девушка смеётся в капсуле) на «будто выспалась»", "note": "про мышечную боль и «крепатуру» не говорим — только восстановление", "dv": [6, "6"], "lines": [{"who": "tr", "text": "После дня ног половина клиентов пропадает на три дня. Абонемент оплачен, а их нет.", "role": "хук", "sign": "−", "screen": "Тренер у пустого зала с журналом посещений · плашка «Куда пропадают клиенты после ног?»"}, {"who": "kl", "text": "Это я. После приседаний мне три дня не до зала: лежу дома с сериалом.", "role": "узнавание", "sign": "−", "screen": "слева: Клиентка на диване с пледом"}, {"who": "tr", "text": "Я тренер, и у нас в клубе теперь стоит криокапсула: две-три минуты в холоде минус сто восемьдесят градусов, голова снаружи. Клиент заходит сразу после тренировки и выходит бодрым.", "role": "поворот", "sign": "+", "screen": "Тренер у капсулы в углу зала · плашка «2–3 минуты · −180 °C»"}, {"who": "kl", "text": "После тренировки ещё и мёрзнуть? Я и так еле живая.", "role": "качели", "sign": "−", "screen": "Клиентка в спортивной форме, без сил"}, {"who": "tr", "text": "Для того она и стоит: холод сразу после нагрузки помогает восстановиться. Так делают спортсмены.", "role": "приём", "sign": "+", "screen": "Тренер открывает дверцу · плашка «восстановление после тренировки»"}, {"who": "kl", "text": "Ладно, захожу. Ой, холодно! Две минуты… А теперь будто выспалась.", "role": "качели", "sign": "±", "screen": "живое видео В02 · пар"}, {"who": "tr", "text": "Без капсулы клиентка три дня дома. С капсулой — завтра снова в зале. А процедуру она оплачивает отдельно: у клуба в чеке вторая строчка.", "role": "приём", "sign": "+", "screen": "разделённый экран: слева диван, справа зал · плашка «абонемент + процедура»"}, {"who": "kl", "text": "Завтра в семь. Что у нас?", "role": "петля", "sign": "+", "screen": "справа: Клиентка завязывает кроссовки"}, {"who": "tr", "text": "Ноги. Увидимся завтра — первый раз без трёх дней перерыва.", "role": "финал", "sign": "+", "screen": "Тренер пишет в журнале, справа зал полный · кнопка «Напишите — посчитаем капсулу для клуба»"}]}, {"id": "2-05", "b": 2, "src": "Р07-2", "rub": "Фитнес-клуб", "t": "Два клуба через дорогу, тренажёры одинаковые", "len": 55, "hook_plate": "Как удержать клиента без скидки?", "chars": ["pr", "tr"], "idea": "Война ценников: таблички на двух клубах через дорогу снижаются по очереди. Капсула останавливает войну: у клиента появляется причина остаться. Финал — сосед в бинокль разглядывает пар.", "cta": "Напишите — посчитаем, что капсула даст клубу", "live": "видео В07 (капсула в клубах пара) на «причина остаться»", "dv": [7, "8"], "lines": [{"who": "pr", "text": "Мой клуб и клуб напротив. Тренажёры одинаковые. Он снизил абонемент на сто рублей, я на двести, он на триста.", "role": "хук", "sign": "−", "screen": "два клуба через дорогу, ценники на окнах падают по очереди · плашка «Как удержать клиента без скидки?»"}, {"who": "pr", "text": "В итоге оба в минусе, а клиенты бегают через дорогу за сотней рублей.", "role": "узнавание", "sign": "−", "screen": "клиент с сумкой перебегает дорогу туда-обратно"}, {"who": "tr", "text": "Я ваш тренер. Дайте им то, чего напротив нет: криокапсулу. Две-три минуты в холоде минус сто восемьдесят градусов, голова снаружи — и после тренировки клиент выходит бодрым.", "role": "поворот", "sign": "+", "screen": "Тренер разворачивает к владельцу планшет с капсулой · плашка «2–3 минуты · −180 °C»"}, {"who": "pr", "text": "Ещё одна статья расходов. Я и так в минусе.", "role": "качели", "sign": "−", "screen": "Владелец хватается за голову"}, {"who": "tr", "text": "Это статья доходов: процедуру клиент оплачивает отдельно. В чеке кроме абонемента появляется вторая строчка.", "role": "приём", "sign": "+", "screen": "чек: «абонемент» и ниже золотом «криопроцедура»"}, {"who": "pr", "text": "А место? У нас каждый метр занят.", "role": "качели", "sign": "−", "screen": "тесный зал, тренажёры впритык"}, {"who": "tr", "text": "Капсуле хватит места метр на два у стены и обычной розетки.", "role": "приём", "sign": "+", "screen": "капсула встаёт у стены · плашка «1 × 2 м · обычная розетка»"}, {"who": "pr", "text": "И что, бегать через дорогу перестанут?", "role": "петля", "sign": "−", "screen": "Владелец смотрит в окно на клуб напротив"}, {"who": "tr", "text": "Абонемент можно найти дешевле. А холода напротив нет. Теперь у клиента есть причина остаться.", "role": "доказательство", "sign": "+", "screen": "живое видео В07 · у капсулы очередь"}, {"who": "pr", "text": "Смотри: сосед напротив разглядывает в бинокль очередь к нашей капсуле. И скидку свою, похоже, отменил.", "role": "финал", "sign": "+", "screen": "в окне напротив — бинокль, ценник напротив ползёт вверх · кнопка «Напишите — посчитаем, что капсула даст клубу»"}]}, {"id": "2-06", "b": 2, "src": "Р08-2", "rub": "Спортивные команды", "t": "Двадцать игроков успевают, пока тренер разбирает игру", "len": 58, "hook_plate": "20 игроков за час — реально?", "chars": ["tr", "dm"], "idea": "Арифметика очереди: таймер разбора игры «60:00» идёт весь ролик, рядом счётчик игроков «0 / 20». Финал — тренер спрашивает про игру, а вся команда уже в валенках.", "cta": "Напишите — расскажем, как это устроено у команд", "live": "видео В16 (валенки надевают, вход) на «следующий уже обувается»", "note": "команды не называем", "dv": [5, "7"], "lines": [{"who": "tr", "text": "Я тренер футбольной команды. После игры у меня час разбора у доски. Двадцать игроков, одна капсула. Успеют все пройти капсулу?", "role": "хук", "sign": "±", "screen": "Тренер у доски с тактикой, таймер «60:00», счётчик «0 / 20» · плашка «20 игроков за час — реально?»"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем криокапсулы. Посчитаем. Игрок в шортах стоит в холоде минус сто восемьдесят градусов две-три минуты, голова снаружи. Двадцать игроков по три минуты — час.", "role": "поворот", "sign": "+", "screen": "Дмитрий с маркером дописывает на доске «20 × 3 = 60» · плашка «2–3 минуты · −180 °C»"}, {"who": "tr", "text": "Ровно час? А переодеться, валенки надеть?", "role": "качели", "sign": "−", "screen": "Тренер скептически"}, {"who": "dm", "text": "Валенки и варежки надевают, чтобы ступни и руки не мёрзли. Пока один в капсуле, следующий уже обувается. Очередь идёт, пока вы у доски.", "role": "приём", "sign": "+", "screen": "живое видео В16 · счётчик «6 / 20», таймер «42:00»"}, {"who": "tr", "text": "А зачем им холод после игры? Пусть в душ идут.", "role": "качели", "sign": "−", "screen": "игроки косятся на капсулу"}, {"who": "dm", "text": "Душ — чтобы помыться. Холод сразу после нагрузки — чтобы восстановиться к следующей тренировке. Так работают команды первых дивизионов.", "role": "приём", "sign": "+", "screen": "плашка «восстановление после игры» · счётчик «13 / 20»"}, {"who": "tr", "text": "Ладно. Но если кто-то испугается холода, очередь встанет.", "role": "петля", "sign": "−", "screen": "игрок пятится от капсулы"}, {"who": "dm", "text": "Пусть посмотрит, как выходят остальные: бодрые и с улыбкой. Через три минуты он уже в очереди.", "role": "приём", "sign": "+", "screen": "игроки выходят из пара, смеются · счётчик «20 / 20»"}, {"who": "tr", "text": "Так, вопросы по игре? Тишина. Все двадцать уже прошли капсулу и сидят передо мной в валенках.", "role": "финал", "sign": "+", "screen": "таймер «00:00», вся команда в валенках и варежках смотрит на тренера · кнопка «Напишите — расскажем, как это у команд»"}]}, {"id": "2-07", "b": 2, "src": "Р09-1", "rub": "Капсула дома", "t": "Три минуты холода — час дороги. Или дверь за стеной", "len": 54, "hook_plate": "3 минуты или час?", "chars": ["pr", "dm"], "idea": "Разделённый экран и два секундомера: слева дорога через город за процедурой, справа та же капсула дома за стеной. Слева время бежит, справа — три минуты. Салон слева не называем: дорога, пробка, парковка.", "cta": "Напишите — подберём капсулу для дома", "live": "П27 («обычная розетка… полтора киловатта») с подводкой Дмитрия; видео В15 (капсула в частном доме)", "dv": [6, "7"], "lines": [{"who": "pr", "text": "Три минуты холода. А дорога до них — час: пробка, парковка, запись на семь.", "role": "хук", "sign": "−", "screen": "слева: пробка, секундомер «0:47» бежит · плашка «3 минуты или час?»"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем криокапсулы. А если та же капсула стоит у вас дома, за стеной? Две-три минуты в холоде минус сто восемьдесят, голова снаружи — и вы бодры на весь день и крепче спите.", "role": "поворот", "sign": "+", "screen": "справа: халат, дверь в соседнюю комнату, капсула · живое видео В15"}, {"who": "pr", "text": "Дома? Куда я её поставлю, у меня не дворец.", "role": "качели", "sign": "−", "screen": "Предприниматель оглядывает квартиру"}, {"who": "dm", "text": "Хватит комнаты от восьми квадратных метров: ровный пол, свежий воздух и розетка.", "role": "приём", "sign": "+", "screen": "план комнаты · плашка «от 8 м² · ровный пол · вентиляция · розетка»"}, {"who": "pr", "text": "Розетка? Электрик сказал, под такую технику надо тянуть отдельную линию.", "role": "качели", "sign": "−", "screen": "электрик с мотком кабеля"}, {"who": "dm", "text": "Отдельную линию тянуть не придётся. Про розетку я всегда отвечаю одно:", "role": "качели", "sign": "±", "screen": "Дмитрий улыбается"}, {"who": "live:П27", "text": "Оборудование включается в обычную бытовую розетку, туда, куда мы можем включить чайник… потребляемая мощность полтора киловатта.", "role": "доказательство", "sign": "+", "screen": "его кадр · плашка «обычная розетка · 1,5 кВт»"}, {"who": "pr", "text": "Ладно. А после процедуры что — полчаса отходить?", "role": "петля", "sign": "−", "screen": "слева секундомер «1:05»"}, {"who": "dm", "text": "Оделись — и дальше по своим делам. Вся процедура — три минуты.", "role": "приём", "sign": "+", "screen": "справа секундомер «3:00» останавливается"}, {"who": "pr", "text": "Три минуты — и я уже пью чай на кухне. Раньше в это время я ещё стоял бы в пробке.", "role": "финал", "sign": "+", "screen": "справа: кухня, чашка; слева: круги по парковке · кнопка «Напишите — подберём капсулу для дома»"}]}, {"id": "2-08", "b": 2, "src": "Р09-3", "rub": "Капсула дома", "t": "Подарок тому, у кого всё есть", "len": 55, "hook_plate": "Что подарить, когда всё есть?", "chars": ["pr", "kl"], "idea": "Список «у него уже есть» вычёркивается строка за строкой. Капсулу в бумагу не завернёшь, поэтому CryoOne делает именной сертификат: модель, обивка, монтаж, запуск. Финал — именинник впервые не знает, что сказать.", "cta": "Напишите — подберём цвет и обивку", "live": "видео В13 (бежевая стёганая капсула) на «закажем бежевую»", "dv": [6, "6"], "lines": [{"who": "pr", "text": "Скидываемся всей компанией другу на юбилей, и явно не по сто рублей. Часы у него есть. Машина есть. Лодка — тоже есть.", "role": "хук", "sign": "−", "screen": "список подарков, строки зачёркиваются одна за другой · плашка «Что подарить, когда всё есть?»"}, {"who": "kl", "text": "Тогда подарим то, чего нет почти ни у кого: криокапсулу. Две-три минуты в холоде минус сто восемьдесят градусов, голова снаружи — и выходишь бодрым. Каждый день, у себя дома.", "role": "поворот", "sign": "+", "screen": "Клиентка вписывает в список «криокапсула»"}, {"who": "pr", "text": "Капсулу? Её в бумагу не завернёшь и под стол не спрячешь.", "role": "качели", "sign": "−", "screen": "Предприниматель с рулоном подарочной бумаги"}, {"who": "kl", "text": "Я спросила у CryoOne, они делают такие капсулы. Для подарка у них есть именной сертификат.", "role": "приём", "sign": "+", "screen": "конверт со снежинкой"}, {"who": "pr", "text": "Сертификат — это бумажка. Откроет конверт и скажет «спасибо»?", "role": "качели", "sign": "−", "screen": "Предприниматель вертит конверт"}, {"who": "kl", "text": "В сертификате всё: модель, цвет и обивка под его интерьер, монтаж и запуск. Капсулу привезут и включат, ему останется зайти.", "role": "приём", "sign": "+", "screen": "плашка-список «модель · обивка · монтаж · запуск»"}, {"who": "pr", "text": "А если она не впишется в его гостиную? У него там всё в бежевом.", "role": "петля", "sign": "−", "screen": "бежевая гостиная друга"}, {"who": "kl", "text": "Значит, закажем бежевую. Корпус и обивку CryoOne делают любого цвета, хоть стёганую кожу под его диван.", "role": "доказательство", "sign": "+", "screen": "Клиентка листает образцы обивки · живое видео В13: бежевая стёганая капсула"}, {"who": "pr", "text": "Вручаем. Человек, у которого всё есть, держит сертификат и впервые не знает, что сказать.", "role": "финал", "sign": "+", "screen": "именинник с конвертом, друзья вокруг · кнопка «Напишите — подберём цвет и обивку»"}]}, {"id": "2-09", "b": 2, "src": "Р10-2", "rub": "Дизайнерам интерьеров", "t": "Спа-зона: сауна есть, хамам есть. Чего не хватает", "len": 58, "hook_plate": "Чем удивить заказчика спа-зоны?", "chars": ["dz", "dm"], "idea": "Дизайнер показывает план коттеджа, заказчик зевает. Капсула входит в план как предмет интерьера: цвет, фактура, логотип по желанию, место — ещё на стройке, как котельная. Финал — заказчик впервые переспрашивает.", "cta": "Напишите — пришлём требования к помещению для проекта", "live": "П28 («цвета, фактуры, текстуры») с подводкой Дмитрия; видео В13 (стёганая капсула), В15 (капсула в доме)", "dv": [8, "8"], "lines": [{"who": "dz", "text": "Проект коттеджа: сауна, хамам, купель. Показываю заказчику — он зевает.", "role": "хук", "sign": "−", "screen": "Дизайнер у плана дома, заказчик зевает · плашка «Чем удивить заказчика спа-зоны?»"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем криокапсулы. Добавьте в спа-зону холод: кабину, где человек две-три минуты стоит при минус ста восьмидесяти градусах, голова снаружи, и выходит бодрым.", "role": "поворот", "sign": "+", "screen": "на плане появляется контур капсулы рядом с сауной · плашка «2–3 минуты · −180 °C»"}, {"who": "dz", "text": "Серебристый холодильник посреди спа? Он мне весь интерьер убьёт.", "role": "качели", "sign": "−", "screen": "Дизайнер морщится"}, {"who": "dm", "text": "Корпус делаем под проект. Про это я всегда говорю:", "role": "качели", "sign": "±", "screen": "образцы обивки веером"}, {"who": "live:П28", "text": "…мы можем сделать под запрос любой, любое там дизайнерское решение можем воплотить, то есть это и цвета, и фактуры, и текстуры, здесь никаких ограничений нет.", "role": "доказательство", "sign": "+", "screen": "его кадр · живое видео В13: стёганая капсула"}, {"who": "dz", "text": "А логотип? Заказчик не любит чужие надписи в доме.", "role": "качели", "sign": "−", "screen": "Дизайнер показывает на снежинку"}, {"who": "dm", "text": "Логотип — по желанию. Семья из Подмосковья попросила без него — сделали без него.", "role": "доказательство", "sign": "+", "screen": "снежинка исчезает с корпуса"}, {"who": "dz", "text": "Когда её ставить? Дом ещё в бетоне.", "role": "петля", "sign": "−", "screen": "стройка, голые стены"}, {"who": "dm", "text": "Как раз сейчас. Та семья заложила место под капсулу ещё на стройке, как котельную или бассейн. Нужно от восьми квадратных метров, розетка и свежий воздух.", "role": "приём", "sign": "+", "screen": "живое видео В15 · на плане: котельная, гараж, бассейн, капсула · плашка «от 8 м² · розетка · вентиляция»"}, {"who": "dz", "text": "Показываю новый план. Заказчик впервые переспрашивает: «А это что?»", "role": "финал", "sign": "+", "screen": "заказчик наклоняется к плану · кнопка «Напишите — пришлём требования к помещению»"}]}, {"id": "2-10", "b": 2, "src": "Р11-1", "rub": "Своё направление в регионе", "t": "В вашем городе капсулы ещё нет", "len": 60, "hook_plate": "Ваш город — пустая точка?", "chars": ["pr", "mn"], "idea": "Карта России в золотых точках, город героя пустой. Пустота — это ещё никто не привёз: кто купит процедуру, кто делает капсулы, что с регионом. Финал — на карте загорается его точка.", "cta": "Напишите город — расскажем про дилерство", "live": "П24 («от Калининграда до Владивостока… даже на Сахалине») с подводкой Менеджера; видео В10 (сенсорная панель)", "note": "эксклюзив на регион — «можно обсудить», не «даём»", "dv": [5, "7"], "lines": [{"who": "pr", "text": "Карта России в золотых точках. Калининград, Сочи, даже Сахалин. А мой город — пустой.", "role": "хук", "sign": "±", "screen": "карта России, золотые точки, один город серый · плашка «Ваш город — пустая точка?»"}, {"who": "mn", "text": "Я менеджер CryoOne. Золотые точки — наши криокапсулы: в каждой гость две-три минуты стоит в холоде минус сто восемьдесят градусов, голова снаружи. Наш основатель Дмитрий говорит так:", "role": "поворот", "sign": "±", "screen": "Менеджер у карты · плашка «2–3 минуты · −180 °C»"}, {"who": "live:П24", "text": "Мы ставим там по всей России — от Калининграда до Владивостока. Даже на Сахалине есть такие станции.", "role": "доказательство", "sign": "+", "screen": "его кадр · точки загораются с запада на восток"}, {"who": "pr", "text": "Раз у нас пусто — значит, у нас это никому не нужно.", "role": "качели", "sign": "−", "screen": "Предприниматель тычет в серую точку"}, {"who": "mn", "text": "Или просто никто ещё не привёз. Станьте дилером CryoOne в своём городе: продавайте капсулы тем, кто купит их для своих гостей, — фитнес-клубам, студиям, санаториям.", "role": "приём", "sign": "+", "screen": "вокруг точки появляются значки: клуб, студия, санаторий"}, {"who": "pr", "text": "Я им что, капсулы сам делать буду? У меня даже склада нет.", "role": "качели", "sign": "−", "screen": "Предприниматель в пустом гараже"}, {"who": "mn", "text": "Делать — наша работа. Вы находите покупателей и ведёте их, завод в Петербурге собирает и привозит.", "role": "приём", "sign": "+", "screen": "грузовик со снежинкой едет из Петербурга · живое видео В10"}, {"who": "pr", "text": "А если через месяц рядом появится второй такой же продавец?", "role": "петля", "sign": "−", "screen": "на карте рядом мигает чужая точка"}, {"who": "mn", "text": "Регион можно закрепить за вами, чтобы рядом не появился второй продавец. Это обсуждаем заранее.", "role": "доказательство", "sign": "+", "screen": "вокруг города рисуется золотая граница"}, {"who": "pr", "text": "Тогда пишу вам свой город. Пусть на карте загорится моя точка.", "role": "финал", "sign": "+", "screen": "серая точка загорается золотом · кнопка «Напишите город — расскажем про дилерство»"}]}, {"id": "3-01", "b": 3, "src": "Р01-3", "rub": "Доп-услуга в действующий бизнес", "t": "База, которая год молчит", "len": 60, "hook_plate": "Что написать базе, которая молчит?", "chars": ["ad", "pr", "mn", "kl"], "idea": "Сообщение уснувшей базе собираем на экране телефона по строкам: счётчик «0 / 3» висит до конца. Скидка базу уже не будит, будит то, чего у студии ещё не было. Зритель уносит готовое сообщение в три строки.", "cta": "Напишите — пришлём, как вернуть уснувшую базу", "live": "видео В05 (гостья после процедуры: «после — прикольно») на «весь день бодрая»", "dv": [6, "7"], "lines": [{"who": "ad", "text": "Двести гостей в базе, последний визит — прошлой осенью. Я дважды писала им про скидку. Ответили двое, и те отписались.", "role": "хук", "sign": "−", "screen": "Администратор листает базу в телефоне, у каждой карточки серая дата «октябрь» · плашка «Что написать базе, которая молчит?»"}, {"who": "pr", "text": "Скидку они видели сто раз. А криокапсулу у нас — ни разу: гость две-три минуты стоит в холоде минус сто восемьдесят градусов, голова снаружи, и выходит бодрым. Про неё и напишем.", "role": "поворот", "sign": "+", "screen": "Предприниматель хлопает по капсуле с золотой снежинкой · плашка «2–3 минуты · −180 °C»"}, {"who": "ad", "text": "Напишу: «У нас новинка, приходите». Так?", "role": "качели", "sign": "−", "screen": "Администратор печатает, на экране телефона — серое «приходите»"}, {"who": "pr", "text": "Погоди. CryoOne, у которых мы брали капсулу, помогают и с запуском. Звоню им.", "role": "качели", "sign": "±", "screen": "Предприниматель набирает номер на громкой связи"}, {"who": "mn", "text": "Менеджер CryoOne, слушаю. «Приходите» пролистают. Пишите гостям в три строки. Первая — имя и сколько не виделись: «Анна, мы не виделись год».", "role": "приём", "sign": "+", "screen": "Менеджер в окошке звонка · на экране печатается первая строка · счётчик «1 / 3»"}, {"who": "mn", "text": "Вторая строка — что новое и что гость почувствует: «Две минуты холода — и весь день бодрая».", "role": "приём", "sign": "+", "screen": "вторая строка · живое видео В05 · счётчик «2 / 3»"}, {"who": "ad", "text": "А если спросят цену и пропадут?", "role": "качели", "sign": "−", "screen": "Администратор грызёт карандаш"}, {"who": "mn", "text": "Поэтому третья — день и время: «Для вас окно в четверг в семь. Записать?» На такой вопрос отвечают «да» или «нет».", "role": "приём", "sign": "+", "screen": "третья строка · счётчик «3 / 3» · сообщение целиком висит на экране"}, {"who": "ad", "text": "Отправила. Пять минут — тишина. Десять — тишина.", "role": "петля", "sign": "−", "screen": "Администратор смотрит на телефон, часы на стене тикают"}, {"who": "kl", "text": "Это Анна! Четверг, семь — держите за мной. А правда, что потом весь день бодрая?", "role": "доказательство", "sign": "+", "screen": "Клиентка с телефоном у уха, в пальто, улыбается"}, {"who": "ad", "text": "Правда. Записала. Ой, ещё одна отвечает. И ещё.", "role": "финал", "sign": "+", "screen": "телефон вибрирует без остановки, в базе карточки одна за другой загораются золотом · кнопка «Напишите — пришлём, как вернуть уснувшую базу»"}]}, {"id": "3-02", "b": 3, "src": "Р01-5", "rub": "Доп-услуга в действующий бизнес", "t": "Гости сами снимают вашу рекламу", "len": 57, "hook_plate": "Реклама, за которую вы не платите", "chars": ["pr", "kl", "mn"], "idea": "Разделённый экран: слева платная реклама студии, справа сторис гостьи из капсулы. Счётчик просмотров справа растёт весь ролик, слева стоит. Зритель уносит три шага, чтобы гость снял студию: название за спиной, предложить снять, попросить отметить.", "cta": "Напишите — расскажем, как крио работает на рекламу", "live": "видео В07 (капсула в клубах пара) на «пар, эмоции, красиво»", "dv": [5, "7"], "lines": [{"who": "pr", "text": "Я каждый месяц плачу за рекламу. А вчера гостья бесплатно сняла про мою студию ролик лучше, чем мой рекламщик.", "role": "хук", "sign": "±", "screen": "разделённый экран: слева платная реклама «0 просмотров», справа сторис из пара · плашка «Реклама, за которую вы не платите»"}, {"who": "kl", "text": "Всем привет, я в криокапсуле! Вокруг холодный пар, минус сто восемьдесят градусов, голова снаружи. Две минуты — и я проснулась окончательно.", "role": "поворот", "sign": "+", "screen": "сторис: Клиентка в капсуле снимает себя на телефон, вокруг пар"}, {"who": "pr", "text": "Красиво. Только видно пар и её лицо. А чья это студия — непонятно.", "role": "качели", "sign": "−", "screen": "Предприниматель вглядывается в сторис: за гостьей голая стена"}, {"who": "mn", "text": "Я менеджер CryoOne, вы у нас капсулу брали. Такие ролики гости снимают часто: пар, эмоции, красиво. Чтобы в них была ваша студия, нужны три шага.", "role": "приём", "sign": "+", "screen": "Менеджер · живое видео В07 · справа счётчик «1 200»"}, {"who": "mn", "text": "Шаг первый: поставьте капсулу так, чтобы за спиной у гостя было название студии.", "role": "приём", "sign": "+", "screen": "капсулу разворачивают, за ней — вывеска студии · список «1. название за спиной»"}, {"who": "pr", "text": "А если гость стесняется снимать сам?", "role": "качели", "sign": "−", "screen": "Гость в капсуле прячет телефон"}, {"who": "mn", "text": "Шаг второй: администратор предлагает: «Хотите, сниму вас в облаке пара на ваш телефон?» Мало кто откажется.", "role": "приём", "sign": "+", "screen": "Администратор снимает гостя на его телефон · список «2. предложить снять»"}, {"who": "pr", "text": "Снимет. А дальше ролик лежит у неё в телефоне.", "role": "качели", "sign": "−", "screen": "видео уезжает в папку «Галерея»"}, {"who": "mn", "text": "Шаг третий: попросите отметить студию. Подруги видят, где это было, и пишут вам.", "role": "приём", "sign": "+", "screen": "отметка студии на сторис, в директ сыплются сообщения · список «3. отметить студию» · счётчик справа «2 800»"}, {"who": "pr", "text": "Три тысячи просмотров у её сторис. Две подруги уже записались. А счёт за эту рекламу мне так и не пришёл.", "role": "финал", "sign": "+", "screen": "Предприниматель держит пустой конверт «счёт», справа счётчик «3 000», список висит · кнопка «Напишите — расскажем, как крио работает на рекламу»"}]}, {"id": "3-03", "b": 3, "src": "Р02-1", "rub": "Окупаемость без сказок", "t": "Капсула — не курица с золотыми яйцами", "len": 58, "hook_plate": "Через сколько окупится капсула?", "chars": ["pr", "dm"], "idea": "Сказка наоборот: предприниматель постелил у капсулы солому и ждёт золотых яиц. Формула «реклама → гости → деньги» собирается на экране и висит до конца; срок окупаемости — в последней трети.", "cta": "Напишите город — посчитаем окупаемость", "live": "П30 («от шести месяцев») с подводкой Дмитрия", "dv": [7, "6"], "lines": [{"who": "pr", "text": "Купил криокапсулу. Постелил рядом солому. Жду, когда начнёт нести золотые яйца.", "role": "хук", "sign": "−", "screen": "гнездо из соломы у капсулы, предприниматель с корзинкой · плашка «Через сколько окупится капсула?»"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем эти капсулы. Зарабатывает она на гостях: человек две-три минуты стоит в холоде минус сто восемьдесят градусов, голова снаружи, и выходит бодрым. А золотые яйца она не несёт.", "role": "поворот", "sign": "±", "screen": "Дмитрий заглядывает в пустое гнездо · плашка «2–3 минуты · −180 °C»"}, {"who": "pr", "text": "Так зачем я её покупал?", "role": "качели", "sign": "−", "screen": "Предприниматель роняет корзинку"}, {"who": "dm", "text": "Чтобы зарабатывать. Схема простая: реклама приводит гостей, гости приносят деньги.", "role": "поворот", "sign": "+", "screen": "формула «реклама → гости → деньги» встаёт на экране и висит до конца"}, {"who": "pr", "text": "Реклама — это деньги. А у меня на неё бюджета нет.", "role": "качели", "sign": "−", "screen": "Предприниматель выворачивает пустой карман"}, {"who": "dm", "text": "Первая реклама у вас бесплатная: ваша база. Те, кто и так ходит к вам на растяжку, узнают про холод первыми.", "role": "приём", "sign": "+", "screen": "в формуле загорается «реклама» · плашка «своя база»"}, {"who": "dm", "text": "Вторая — сторис, которые гости снимают прямо в капсуле. Третья — наши маркетологи: первый месяц каждую неделю дают план, от рассылки до дня открытых дверей.", "role": "приём", "sign": "+", "screen": "сторис гостьи · листок с планом по неделям · в формуле загорается «гости»"}, {"who": "pr", "text": "И через сколько гости окупят капсулу?", "role": "петля", "sign": "−", "screen": "Предприниматель с калькулятором"}, {"who": "dm", "text": "Точно посчитаем под ваш город и цену сеанса. А по нашим покупателям я всегда отвечаю так:", "role": "качели", "sign": "±", "screen": "Дмитрий берёт калькулятор"}, {"who": "live:П30", "text": "Вообще, в целом, окупаемость от шести месяцев.", "role": "доказательство", "sign": "+", "screen": "его кадр · в формуле загорается «деньги» · плашка «окупаемость — от 6 месяцев»"}, {"who": "pr", "text": "Солому убираю. Корзинку оставлю — под выручку.", "role": "финал", "sign": "+", "screen": "Предприниматель выметает солому, корзинку ставит на стойку · формула висит · кнопка «Напишите город — посчитаем окупаемость»"}]}, {"id": "3-04", "b": 3, "src": "Р02-5", "rub": "Окупаемость без сказок", "t": "Сколько брать с гостя за процедуру", "len": 59, "hook_plate": "Цена сеанса: 3 проверки", "chars": ["pr", "dm"], "idea": "Ценник на капсуле крутится между «1 000» и «10 000» и останавливается только в финале. Три проверки цены собираются на экране: город, азот, курс. Вилку называем только официальную.", "cta": "Напишите город — подскажем цену процедуры", "live": "видео В01 (гость в капсуле, лого) на «сеанс»; В11 (сосуд Дьюара) на «азот»", "dv": [5, "7"], "lines": [{"who": "pr", "text": "Поставлю тысячу — решат, что дешёвка. Поставлю десять — не придут. Сколько брать за сеанс?", "role": "хук", "sign": "−", "screen": "ценник на капсуле крутится: 1 000 ↔ 10 000 · плашка «Цена сеанса: 3 проверки»"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем эти капсулы. Сеанс — две-три минуты в холоде минус сто восемьдесят градусов, голова снаружи. Гость выходит бодрым и платит за это от двух с половиной до шести тысяч рублей.", "role": "поворот", "sign": "+", "screen": "Дмитрий у капсулы · живое видео В01 · плашка «2 500–6 000 ₽ за сеанс»"}, {"who": "pr", "text": "Вилка больше чем вдвое. Мне куда в ней?", "role": "качели", "sign": "−", "screen": "Предприниматель растягивает вилку руками"}, {"who": "dm", "text": "Цену проверяют по трём вещам. Первая — город: в миллионнике гость привык к одной цене, в райцентре — к другой. Цифру для вашего города подскажем.", "role": "приём", "sign": "+", "screen": "карта: большой город и маленький · список «1. город»"}, {"who": "pr", "text": "А если поставлю дешевле всех? Тогда точно придут.", "role": "качели", "sign": "−", "screen": "Предприниматель рисует на ценнике «999»"}, {"who": "dm", "text": "Придут — и вы прогорите. Вторая проверка — азот. Холод в капсуле даёт жидкий азот, и на каждый сеанс он уходит. Цена ниже азота — и вы работаете в убыток.", "role": "приём", "sign": "+", "screen": "живое видео В11 · из сосуда вылетают монеты · список «2. азот»"}, {"who": "pr", "text": "Ладно. А как сделать, чтобы гость пришёл второй раз?", "role": "петля", "sign": "−", "screen": "Предприниматель смотрит вслед уходящей гостье"}, {"who": "dm", "text": "Третья — курс. Пять сеансов сразу чуть дешевле, чем по одному: гостю выгодно, а вы знаете, что он вернётся ещё четыре раза.", "role": "приём", "sign": "+", "screen": "абонемент на пять сеансов · список «3. курс»"}, {"who": "pr", "text": "Город, азот, курс. Ставлю цену — и первая гостья берёт сразу пять сеансов.", "role": "финал", "sign": "+", "screen": "ценник останавливается на цифре, гостья забирает абонемент · список висит · кнопка «Напишите город — подскажем цену»"}]}, {"id": "3-05", "b": 3, "src": "Р04-1", "rub": "Было → стало: истории", "t": "Студия ждала девушек, а пришли бородатые спортсмены", "len": 60, "hook_plate": "Кто пришёл на крио?", "chars": ["ad", "mn"], "idea": "Кейс студии растяжки в Калининграде журналом записи: «было» — розовые стены и одни девушки, «стало» — сосуды азота вторым рейсом. Кто пришёл, видно только в середине. Зритель уносит: капсула приводит гостей, которых у студии раньше не было. Финал — журнал с мужскими именами и заказ сосуда, без поз на коврике.", "cta": "Напишите — расскажем, как запускалась эта студия", "live": "видео В12 (мужчина в капсуле) на «спортсмены»; В11 (сосуд Дьюара) на «термосы»", "note": "«удвоила спрос», «+30 % мужчин» и цену азота в Калининграде не называем, пока не подтверждено; хозяйку студии играет Администратор — нового персонажа не рисуем", "dv": [6, "7"], "lines": [{"who": "ad", "text": "Калининград, студия растяжки. Розовые стены, коврики, занимаются одни девушки. Для них и ставили криокапсулу.", "role": "хук", "sign": "±", "screen": "розовая студия, девушки на ковриках, в углу капсула с золотой снежинкой · плашка «Кто пришёл на крио?»"}, {"who": "mn", "text": "Я менеджер CryoOne, мы ставили им капсулу. Это кабина, где гость две-три минуты стоит в холоде минус сто восемьдесят градусов, голова снаружи, и выходит бодрым. Девушкам понравится, думали все.", "role": "поворот", "sign": "+", "screen": "Менеджер с папкой «Калининград» · плашка «2–3 минуты · −180 °C»"}, {"who": "ad", "text": "Только решались долго: холод в капсуле даёт жидкий азот, а к нам его везут издалека.", "role": "узнавание", "sign": "−", "screen": "Администратор с калькулятором, на карте — Калининград отдельно от России"}, {"who": "mn", "text": "Поэтому азот для студии нашли мы, CryoOne, и заранее посчитали сеанс. Расчёт сошёлся — капсулу поставили.", "role": "приём", "sign": "+", "screen": "плашка «азот найден · сеанс посчитан»"}, {"who": "ad", "text": "Ждём девушек. Открывается дверь, а на пороге — бородатый мужчина со спортивной сумкой.", "role": "петля", "sign": "±", "screen": "в дверях бородатый спортсмен, девушки оборачиваются"}, {"who": "mn", "text": "Мужчины-спортсмены: они восстанавливаются холодом после нагрузок. И стали большой частью гостей на крио.", "role": "доказательство", "sign": "+", "screen": "живое видео В12 · плашка «восстановление после тренировок»"}, {"who": "ad", "text": "Через месяц новая беда: азот кончается к середине недели.", "role": "качели", "sign": "−", "screen": "пустой сосуд, на календаре — среда"}, {"who": "mn", "text": "Хорошая беда: гостей больше, чем считали. Мы привезли ещё сосуды — большие термосы с азотом. Капсула привела тех, кто раньше в студию не заходил.", "role": "доказательство", "sign": "+", "screen": "живое видео В11 · грузовик со снежинкой привозит сосуды · плашка «+ сосуды через месяц»"}, {"who": "ad", "text": "Андрей, Игорь, Сергей, Максим, снова Андрей… Алло, CryoOne? Нам ещё один сосуд.", "role": "финал", "sign": "+", "screen": "Администратор листает журнал записи на крио — подряд мужские имена — и звонит · кнопка «Напишите — расскажем, как запускалась эта студия»"}]}, {"id": "3-06", "b": 3, "src": "Р16-3", "rub": "Сервис и гарантия", "t": "Звонят даже чужие клиенты", "len": 50, "hook_plate": "Капсула стоит. Кто приедет?", "chars": ["pr", "mn", "dm"], "idea": "Звонок владельца чужой капсулы: счётчик «простой: 21 день» висит над его капсулой весь ролик. CryoOne помогает и ему, а своим — выезд за 1–3 дня и гарантия 12–24 месяца. Финал сравнивает три недели и три дня.", "cta": "Напишите — расскажем, как работает сервис", "live": "видео В08 (оператор с пультом, гости входят и выходят) на «капсула снова работает»", "note": "производителя чужой капсулы не называем", "dv": [7, "7"], "lines": [{"who": "pr", "text": "Алло, CryoOne? У меня криокапсула другой фирмы. Сломалась, третью неделю стоит, а производитель трубку не берёт. Поможете?", "role": "хук", "sign": "−", "screen": "Предприниматель с телефоном у тёмной капсулы, над ней счётчик «простой: 21 день» · плашка «Капсула стоит. Кто приедет?»"}, {"who": "mn", "text": "Я менеджер CryoOne. Значит, три недели гости приходят к вам на две-три минуты холода при минус ста восьмидесяти градусах и уходят ни с чем. Каждый такой день — потерянные деньги. Поможем.", "role": "поворот", "sign": "+", "screen": "Менеджер в гарнитуре · плашка «2–3 минуты · −180 °C»"}, {"who": "pr", "text": "Вы же мне ничего не должны. Капсулу я брал у других.", "role": "качели", "sign": "−", "screen": "Предприниматель смущённо чешет затылок"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем такие капсулы. Холод — наше ремесло, чья бы ни была капсула. Поддержка отвечает круглосуточно: найдём поломку и скажем, что делать. Понадобится — приеду сам.", "role": "приём", "sign": "+", "screen": "Дмитрий с чемоданчиком инструментов · плашка «поддержка 24/7» · живое видео В08"}, {"who": "pr", "text": "А была бы капсула ваша — тоже три недели ждать?", "role": "петля", "sign": "−", "screen": "Предприниматель косится на счётчик «21»"}, {"who": "mn", "text": "Своим сервис приезжает за один-три дня.", "role": "доказательство", "sign": "+", "screen": "плашка «выезд — 1–3 дня»"}, {"who": "dm", "text": "И гарантия у своих — год, а на ряд моделей два: вдвое дольше рынка.", "role": "доказательство", "sign": "+", "screen": "плашка «гарантия 12–24 мес.»"}, {"who": "pr", "text": "Три недели у них — и три дня у вас. Следующую капсулу я, кажется, уже выбрал.", "role": "финал", "sign": "+", "screen": "счётчик «21» гаснет, рядом загорается «1–3» · кнопка «Напишите — расскажем, как работает сервис»"}]}, {"id": "3-07", "b": 3, "src": "Р18-3", "rub": "Первый раз (клиентам)", "t": "Валенки и варежки: в чём заходить", "len": 50, "hook_plate": "Что взять на крио?", "chars": ["kl", "ad"], "idea": "Распаковка сумки: гостья собралась как на Северный полюс, администратор возвращает вещи по одной. Список «что ваше, что наше» собирается и висит до конца. Ролик для салонов, которые купили капсулу.", "cta": "Где попробовать рядом — спросите в комментариях", "live": "видео В16 (валенки надевают, вход) на «валенки»; В21 (процедура целиком) на «захожу»", "note": "в описании — строка про противопоказания; на репликах клиентки плашек нет, она в кадре", "dv": [5, "6"], "lines": [{"who": "kl", "text": "Иду первый раз в криокапсулу. Там минус сто восемьдесят! Взяла шапку, шарф, две пары шерстяных носков и термос.", "role": "хук", "sign": "−", "screen": "Клиентка с огромной сумкой у стойки салона, вещи вываливаются · плашка «Что взять на крио?» вверху кадра, лицо открыто"}, {"who": "ad", "text": "Я администратор, давайте разбирать. Холод там правда минус сто восемьдесят градусов. Но всего две-три минуты, и голова снаружи, над бортом капсулы. Поэтому шапка остаётся в сумке.", "role": "поворот", "sign": "+", "screen": "Администратор кладёт шапку обратно · плашка «2–3 минуты · голова снаружи»"}, {"who": "kl", "text": "А шарф? Горло же!", "role": "качели", "sign": "−", "screen": "Клиентка прижимает шарф к груди"}, {"who": "ad", "text": "Горло тоже снаружи. Шарф — к шапке.", "role": "приём", "sign": "+", "screen": "шарф летит в сумку"}, {"who": "kl", "text": "Ну носки-то хоть можно? У меня ноги мёрзнут первыми.", "role": "качели", "sign": "−", "screen": "Клиентка трясёт шерстяными носками"}, {"who": "ad", "text": "Для ног у нас валенки, для рук — варежки, их выдаём мы. От вас — только купальник или бельё. А термос пригодится после: попьёте чаю.", "role": "приём", "sign": "+", "screen": "живое видео В16: валенки с логотипом · список «купальник — ваш · валенки и варежки — наши» висит до конца"}, {"who": "kl", "text": "Купальник и валенки. Как на пляж в январе. А зачем я вообще туда иду?", "role": "качели", "sign": "±", "screen": "Клиентка в валенках и варежках разглядывает себя в зеркале"}, {"who": "ad", "text": "За бодростью. После холода гости выходят бодрыми, а ночью крепче спят.", "role": "приём", "sign": "+", "screen": "плашка «бодрость · крепкий сон»"}, {"who": "kl", "text": "Ладно, захожу. Ой, холодно! Холодно… А теперь тепло.", "role": "качели", "sign": "±", "screen": "живое видео В21 · Клиентка в паре"}, {"who": "kl", "text": "Выжила! Шарф не пригодился, мне и так тепло. Чувствую себя — бодро!", "role": "финал", "sign": "+", "screen": "Клиентка выходит из пара, сияет, сумка так и стоит у стойки · кнопка «Где попробовать рядом — спросите в комментариях»"}]}, {"id": "3-08", "b": 3, "src": "Р18-2", "rub": "Первый раз (клиентам)", "t": "Замёрзну? Как на Балтике в начале лета", "len": 52, "hook_plate": "Замёрзну за 3 минуты?", "chars": ["kl", "dm"], "idea": "Лестница сравнений холода: офисный кондиционер → холодный душ → Балтика в начале лета. Мерзлячка поднимается по ней и в финале называет курортом свой офис. Сначала — какой холод на ощущение, потом — ради чего он.", "cta": "Где попробовать рядом — спросите в комментариях", "live": "видео В01 (гость в капсуле, лого) на «Балтика»; эфир «Жить здорово» в этом ролике не нужен — те же слова Дмитрий говорит в кадре", "note": "в описании — строка про противопоказания", "dv": [5, "8"], "lines": [{"who": "kl", "text": "Минус сто восемьдесят? Я мёрзну даже под кондиционером в офисе.", "role": "хук", "sign": "−", "screen": "Клиентка в шарфе под офисным кондиционером · плашка «Замёрзну за 3 минуты?» вверху кадра, лицо открыто"}, {"who": "dm", "text": "Я Дмитрий, основатель CryoOne, мы делаем криокапсулы. Минус сто восемьдесят градусов — это холодный пар в кабине. Вы стоите в нём две-три минуты, голова снаружи, и мороз берёт только верхний слой кожи.", "role": "поворот", "sign": "+", "screen": "Дмитрий у капсулы · лестница сравнений, первая ступень «кондиционер» · плашка «2–3 минуты · голова снаружи»"}, {"who": "kl", "text": "Только верхний? А по ощущению как — прорубь?", "role": "качели", "sign": "−", "screen": "Клиентка с опаской смотрит на пар"}, {"who": "dm", "text": "Мягче, чем холодный душ. Немножко холодно, а потом приятно: лёгкий холодок по коже.", "role": "приём", "sign": "+", "screen": "ступень «холодный душ» · плашка «мягче холодного душа»"}, {"who": "kl", "text": "«Немножко» — это сколько, если по-честному?", "role": "качели", "sign": "−", "screen": "Клиентка прищурилась"}, {"who": "dm", "text": "Один гость сказал точнее меня: по ощущению — как на Балтике в начале лета, когда заходишь в воду двенадцать градусов. Бодренько.", "role": "доказательство", "sign": "+", "screen": "живое видео В01: гость в капсуле, лого · ступень «Балтика в июне»"}, {"who": "kl", "text": "Балтику в июне я переживу. Страшно, конечно. А ради чего мёрзнуть?", "role": "качели", "sign": "±", "screen": "Клиентка снимает шарф"}, {"who": "dm", "text": "Ради бодрости на весь день и крепкого сна. Три минуты — и всё. Выходите, а по телу тепло.", "role": "приём", "sign": "+", "screen": "дверца открывается, пар выходит наружу · плашка «бодрость · крепкий сон»"}, {"who": "kl", "text": "Выжила! Бодренько. Кондиционер в офисе мне теперь — курорт.", "role": "финал", "sign": "+", "screen": "Клиентка выходит из пара, сияет · лестница висит · кнопка «Где попробовать рядом — спросите в комментариях»"}]}, {"id": "3-09", "b": 3, "src": "Р19-1", "rub": "Что даёт процедура (клиентам)", "t": "Кофе размером с ведро больше не нужен", "len": 48, "hook_plate": "Бодрость без кофе?", "chars": ["kl", "dm"], "idea": "Утро совы: на столе кружка размером с ведро. Совет коллеги в хуке возвращается в финале — ведро уходит той же коллеге. Польза одна — бодрость; «надолго ли» гостья проверяет сама, без обещаний в часах.", "cta": "Где попробовать рядом — спросите в комментариях", "live": "П14 до слов «без кофе», с подводкой Дмитрия; видео В20 (Катя после процедуры) на «глаза открываются», В21 (процедура) на «захожу»", "note": "в описании — строка про противопоказания; П14 обрезаем на «без кофе», вторую половину фразы не берём", "dv": [7, "7"], "lines": [{"who": "kl", "text": "Восемь утра. Кофе в кружке размером с ведро. Глаза всё равно закрываются.", "role": "хук", "sign": "−", "screen": "Клиентка за столом обнимает ведро кофе · плашка «Бодрость без кофе?» вверху кадра, лицо открыто"}, {"who": "kl", "text": "Коллега говорит: сходи в криокапсулу. Две-три минуты постоять в холоде минус сто восемьдесят градусов, голова снаружи. Это вместо кофе, что ли?", "role": "узнавание", "sign": "±", "screen": "Клиентка косится на бодрую коллегу за соседним столом"}, {"who": "dm", "text": "Вместо кофе. Я Дмитрий, основатель CryoOne, мы делаем эти капсулы. И говорю всегда одно:", "role": "поворот", "sign": "+", "screen": "Дмитрий у капсулы · плашка «2–3 минуты · −180 °C»"}, {"who": "live:П14", "text": "Криокапсула помогает утром проснуться без кофе…", "role": "доказательство", "sign": "+", "screen": "его кадр · ведро на экране перечёркнуто"}, {"who": "kl", "text": "Проснуться? Я сова. Меня даже будильник не берёт.", "role": "качели", "sign": "−", "screen": "Клиентка роняет голову на клавиатуру"}, {"who": "dm", "text": "Холоду всё равно, сова вы или жаворонок. Две-три минуты — и глаза открываются сами.", "role": "приём", "sign": "+", "screen": "живое видео В20: Катя после процедуры"}, {"who": "kl", "text": "А надолго? Кофе через час отпускает.", "role": "петля", "sign": "−", "screen": "Клиентка смотрит на часы: 8:15"}, {"who": "dm", "text": "Проверьте сами: зайдите утром, а в обед посмотрите на часы.", "role": "приём", "sign": "+", "screen": "Дмитрий открывает дверцу капсулы"}, {"who": "kl", "text": "Ладно, проверяю. Захожу. Ой, холодно! А
